<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign Up - Spopeer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/mobile-app.css">
<script src="/js/auth.js"></script>
<style>
  .ms-wrap{min-height:100vh;display:flex;flex-direction:column;background:#fff;max-width:520px;margin:0 auto}
  .ms-hero{flex:0 0 39vh;background:linear-gradient(145deg,#001f3f 0%,#0a3575 60%,#1a6bff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0 24px}
  .ms-hero-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=800') center/cover no-repeat;opacity:.08;pointer-events:none}
  .ms-logo{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:24px;color:#fff;margin-bottom:14px}
  .ms-hero h1{font-family:Syne,sans-serif;font-size:28px;color:#fff;margin:0 0 8px;letter-spacing:-.3px}
  .ms-hero p{color:rgba(255,255,255,.8);font-size:13px;font-weight:600;margin:0;text-align:center;line-height:1.5}
  .ms-body{flex:1;padding:24px 22px 36px}
  .ms-body h2{font-family:Syne,sans-serif;font-size:20px;color:#0f172a;margin:0 0 18px;letter-spacing:-.2px}
  .ms-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ms-field{position:relative;margin-bottom:12px}
  .ms-field i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:13px;pointer-events:none}
  .ms-field input{width:100%;height:48px;border:1.5px solid #e2e8f0;border-radius:13px;padding:0 12px 0 36px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;color:#0f172a;background:#f8fafc;outline:none;transition:border-color .18s,box-shadow .18s;box-sizing:border-box}
  .ms-field input:focus{border-color:#1a6bff;box-shadow:0 0 0 3px rgba(26,107,255,.1);background:#fff}
  .ms-btn-primary{height:50px;background:#1a6bff;color:#fff;border:none;border-radius:999px;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:800;width:100%;cursor:pointer;margin-top:2px}
  .ms-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#94a3b8;font-size:12px;font-weight:700}
  .ms-divider::before,.ms-divider::after{content:'';flex:1;height:1px;background:#e2e8f0}
  .ms-btn-google{height:50px;background:#fff;border:1.5px solid #e2e8f0;border-radius:999px;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;color:#0f172a;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
  .ms-btn-google svg{flex-shrink:0}
  .ms-google-host{min-height:50px;display:flex;justify-content:center;align-items:center}
  .ms-google-host > div{width:100%!important;display:flex;justify-content:center}
  .ms-footer{margin-top:20px;text-align:center;font-size:13px;font-weight:600;color:#64748b}
  .ms-footer a{color:#1a6bff;font-weight:800;text-decoration:none}
  .ms-back-home{margin-top:10px;height:48px;border-radius:999px;border:1.5px solid #cbd5e1;background:#fff;color:#334155;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none}
  #signupError{display:none;background:#fef2f2;border:1px solid #fca5a5;border-radius:12px;padding:10px 14px;color:#dc2626;font-size:13px;font-weight:600;margin-bottom:12px}
  #msSuccess{display:none;background:#dcfce7;border:1px solid #86efac;border-radius:12px;padding:10px 14px;color:#166534;font-size:13px;font-weight:600;margin-bottom:12px}
</style>
<script src="/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="ms-wrap">
  <div class="ms-hero">
    <div class="ms-hero-bg"></div>
    <div class="ms-logo"><i class="fa-solid fa-bolt"></i></div>
    <h1>Join Spopeer</h1>
    <p>Build your sports identity and unlock opportunities globally.</p>
  </div>

  <div class="ms-body">
    <h2>Create Account</h2>
    <div id="signupError"></div>
    <div id="msSuccess"></div>

    <div id="g_id_onload"
      data-client_id="527976493846-99g74l8eqmiui9fro2e1fgf19c27qjii.apps.googleusercontent.com"
      data-callback="handleGoogleCredential"
      data-auto_prompt="false">
    </div>
    <div id="signupGoogleButton" class="ms-google-host" aria-label="Continue with Google"></div>

    <div class="ms-divider">or create with email</div>

    <div class="ms-row">
      <div class="ms-field">
        <i class="fa-regular fa-user"></i>
        <input id="firstName" placeholder="First Name" autocomplete="given-name">
      </div>
      <div class="ms-field">
        <i class="fa-regular fa-user"></i>
        <input id="lastName" placeholder="Last Name" autocomplete="family-name">
      </div>
    </div>
    <div class="ms-field">
      <i class="fa-regular fa-envelope"></i>
      <input id="email" type="email" placeholder="Email" autocomplete="email">
    </div>
    <div class="ms-field">
      <i class="fa-solid fa-lock"></i>
      <input id="password" type="password" placeholder="Password" autocomplete="new-password">
    </div>

    <button id="signupBtn" class="ms-btn-primary">Create Account</button>
    <p class="ms-footer">Already have an account? <a href="/mobile-login.html">Sign In</a></p>
    <a href="/mobile.html" class="ms-back-home">Back to Home</a>
  </div>
</div>

<script>
function getCookieValue(name) {
  var match = document.cookie.match(new RegExp('(^|;\\s*)' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]+)'));
  return match ? decodeURIComponent(match[2]) : '';
}

async function postGoogleCredential(credential) {
  await fetch('/api/auth/csrf', { method: 'GET', credentials: 'include' }).catch(function () {});
  var csrf = getCookieValue('csrf_token');
  var headers = { 'Content-Type': 'application/json' };
  if (csrf) headers['X-CSRF-Token'] = csrf;
  return fetch('/api/auth/google', {
    method: 'POST',
    credentials: 'include',
    headers: headers,
    body: JSON.stringify({ credential: credential })
  });
}

function completeAuthNavigation(path) {
  var targetPath = path || '/mobile.html';
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.location.assign(targetPath);
      window.close();
      return;
    }
  } catch (_error) {}

  try {
    if (window.parent && window.parent !== window) {
      window.parent.location.assign(targetPath);
      return;
    }
  } catch (_error) {}

  window.location.assign(targetPath);
}

function setMessage(elId, msg) {
  var el = document.getElementById(elId);
  if (!el) return;
  el.textContent = msg || '';
  el.style.display = msg ? 'block' : 'none';
}

async function handleGoogleCredential(response) {
  setMessage('signupError', '');
  setMessage('msSuccess', '');
  try {
    const res = await postGoogleCredential(response.credential);
    const data = await res.json();
    if (!res.ok) {
      const errMsg = (data.error && data.error.message) || 'Google sign-up failed.';
      throw new Error(errMsg);
    }

    let userData = (data.data && data.data.user) || data.user || null;
    const accessToken = data.data && data.data.accessToken;
    if (accessToken) localStorage.setItem('spopeerToken', accessToken);

    if (!userData && window.SpopeerAPI && typeof window.SpopeerAPI.me === 'function') {
      const me = await window.SpopeerAPI.me();
      userData = (me && (me.user || (me.data && me.data.user) || me.payload || (me.payload && me.payload.user))) || null;
    }

    if (!userData) throw new Error('Google sign-up finished, but profile could not be loaded.');
    if (window.Auth) window.Auth.login(userData);
    completeAuthNavigation('/mobile.html');
  } catch (err) {
    setMessage('signupError', (err && err.message) || 'Google sign-up failed. Please try email signup.');
  }
}

function initGoogleSignupButton() {
  var host = document.getElementById('signupGoogleButton');
  if (!host) return;

  function wire() {
    if (!window.google || !window.google.accounts || !window.google.accounts.id) return false;
    window.google.accounts.id.initialize({
      client_id: '527976493846-99g74l8eqmiui9fro2e1fgf19c27qjii.apps.googleusercontent.com',
      callback: handleGoogleCredential
    });
    host.innerHTML = '';
    window.google.accounts.id.renderButton(host, {
      theme: 'outline',
      size: 'large',
      text: 'continue_with',
      shape: 'pill',
      width: Math.max(260, Math.min(440, host.clientWidth || 320))
    });
    return true;
  }

  if (wire()) return;
  var attempts = 0;
  var timer = window.setInterval(function () {
    attempts += 1;
    if (wire() || attempts > 20) {
      window.clearInterval(timer);
      if (attempts > 20) {
        setMessage('signupError', 'Google sign-up is unavailable on this browser. Please use email sign-up.');
      }
    }
  }, 250);
}

document.getElementById('signupBtn').onclick = async function() {
  setMessage('signupError', '');
  setMessage('msSuccess', '');
  var payload = {
    firstName: document.getElementById('firstName').value.trim(),
    lastName: document.getElementById('lastName').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  };

  if (!payload.firstName || !payload.lastName || !payload.email || !payload.password) {
    setMessage('signupError', 'Please fill all fields.');
    return;
  }

  try {
    const result = await window.SpopeerAPI.signup(payload);
    const user = (result.data && result.data.user) || result.user || null;
    if (user && window.Auth) {
      window.Auth.login(user);
      window.location.assign('/mobile.html');
      return;
    }
    setMessage('msSuccess', 'Account created. Please check your email to verify, then sign in.');
  } catch (e) {
    setMessage('signupError', (e && e.message) || 'Signup failed.');
  }
};

document.addEventListener('DOMContentLoaded', initGoogleSignupButton);
</script>

</body>
</html>
