<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Spopeer | Careers</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/spopeer-pages.css">
</head>
<body>
  <div class="page-wrap">
    <header class="hero">
      <a class="back-link" href="/mobile.html">Back to Home</a>
      <span class="pill">Join the Team</span>
      <h1 class="page-title">Careers at Spopeer</h1>
      <p class="page-sub">Apply directly with the same API used on the main careers page.</p>
    </header>
    <main class="content">
      <section class="card">
        <div id="careerError" class="error-box"></div>
        <div id="careerSuccess" class="success-box"></div>
        <div class="grid-2">
          <div><label class="label" for="name">Full name *</label><input class="input" id="name" required></div>
          <div><label class="label" for="email">Email *</label><input class="input" id="email" type="email" required></div>
        </div>
        <div class="grid-2" style="margin-top:10px">
          <div><label class="label" for="phone">Phone</label><input class="input" id="phone"></div>
          <div><label class="label" for="position">Position *</label><input class="input" id="position" required></div>
        </div>
        <div style="margin-top:10px"><label class="label" for="resume">Resume URL *</label><input class="input" id="resume" required></div>
        <div style="margin-top:10px"><label class="label" for="portfolio">Portfolio URL</label><input class="input" id="portfolio"></div>
        <div style="margin-top:10px"><label class="label" for="coverLetter">Cover letter *</label><textarea class="textarea" id="coverLetter" required></textarea></div>
        <button id="careerSubmit" class="btn btn-primary" style="width:100%;margin-top:12px">Submit Application</button>
        <p class="footer-note">Endpoint: POST /api/careers</p>
      </section>
    </main>
  </div>
<script>
  document.getElementById('careerSubmit').addEventListener('click', async function () {
    var btn = this;
    var errorBox = document.getElementById('careerError');
    var successBox = document.getElementById('careerSuccess');
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    var payload = {
      name: document.getElementById('name').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      position: document.getElementById('position').value.trim(),
      resume: document.getElementById('resume').value.trim(),
      portfolio: document.getElementById('portfolio').value.trim(),
      coverLetter: document.getElementById('coverLetter').value.trim()
    };

    if (!payload.name || !payload.email || !payload.position || !payload.resume || !payload.coverLetter) {
      errorBox.textContent = 'Please fill all required fields.';
      errorBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';
    try {
      var res = await fetch('/api/careers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok) throw new Error(data.error || 'Failed to submit application.');
      successBox.textContent = 'Application submitted successfully. Our team will contact you soon.';
      successBox.style.display = 'block';
      ['name','email','phone','position','resume','portfolio','coverLetter'].forEach(function (id) { document.getElementById(id).value = ''; });
    } catch (err) {
      errorBox.textContent = err.message || 'Failed to submit application.';
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit Application';
    }
  });
</script>
</body>
</html>
