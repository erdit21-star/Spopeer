<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Spopeer | Contact Us</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/spopeer-pages.css">
  <style>
    .contact-intro{border:1px solid #dbeafe;background:linear-gradient(135deg,#eff6ff,#ffffff);border-radius:18px;padding:14px;margin-bottom:4px}
    .contact-intro p{margin:0;color:#334155;font-size:13px;line-height:1.7;font-weight:600}
    .contact-intro strong{color:#1d4ed8}
  </style>
</head>
<body>
  <div class="page-wrap">
    <header class="hero">
      <span class="pill">Get in Touch</span>
      <h1 class="page-title">Contact Us</h1>
      <p class="page-sub">A question, a partnership idea, or feedback — send it directly and the team will respond.</p>
    </header>
    <main class="content">
      <section class="card">
        <div class="contact-intro"><p>Fill in the form below and your message goes straight to <strong>the Spopeer team</strong>. We reply to every genuine inquiry.</p></div>
        <div id="contactError" class="error-box"></div>
        <div id="contactSuccess" class="success-box"></div>
        <div class="grid-2">
          <div><label class="label" for="firstName">First name *</label><input class="input" id="firstName"></div>
          <div><label class="label" for="lastName">Last name *</label><input class="input" id="lastName"></div>
        </div>
        <div style="margin-top:10px"><label class="label" for="email">Email *</label><input class="input" id="email" type="email"></div>
        <div style="margin-top:10px"><label class="label" for="subject">Subject *</label>
          <select class="select" id="subject">
            <option value="">Select a subject</option>
            <option value="General Inquiry">General Inquiry</option>
            <option value="Technical Support">Technical Support</option>
            <option value="Partnership">Partnership</option>
            <option value="Feedback">Feedback</option>
          </select>
        </div>
        <div style="margin-top:10px"><label class="label" for="message">Message *</label><textarea class="textarea" id="message"></textarea></div>
        <button id="contactSubmit" class="btn btn-primary" style="width:100%;margin-top:12px">Send Message</button>
      </section>
      <section class="card stack">
        <a class="btn btn-secondary" href="/mobile.html">Return to Home</a>
      </section>
    </main>
  </div>
<script>
  document.getElementById('contactSubmit').addEventListener('click', async function () {
    var btn = this;
    var errorBox = document.getElementById('contactError');
    var successBox = document.getElementById('contactSuccess');
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    var payload = {
      firstName: document.getElementById('firstName').value.trim(),
      lastName: document.getElementById('lastName').value.trim(),
      email: document.getElementById('email').value.trim(),
      subject: document.getElementById('subject').value,
      message: document.getElementById('message').value.trim()
    };

    if (!payload.firstName || !payload.lastName || !payload.email || !payload.subject || !payload.message) {
      errorBox.textContent = 'Please fill all required fields.';
      errorBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
      var res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok) throw new Error(data.error || 'Failed to send message.');
      successBox.textContent = 'Message sent successfully. We will get back to you soon.';
      successBox.style.display = 'block';
      ['firstName','lastName','email','subject','message'].forEach(function (id) { document.getElementById(id).value = ''; });
    } catch (err) {
      errorBox.textContent = err.message || 'Failed to send message.';
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Message';
    }
  });
</script>
</body>
</html>
