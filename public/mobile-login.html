<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log In - Spopeer</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/mobile-app.css">
<script src="/js/auth.js"></script>
<style>
  .ml-wrap{min-height:100vh;display:flex;flex-direction:column;background:#fff;max-width:520px;margin:0 auto}

  /* Hero top half */
  .ml-hero{flex:0 0 42vh;background:linear-gradient(145deg,#001f3f 0%,#0a3575 60%,#1a6bff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0 24px}
  .ml-hero-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=800') center/cover no-repeat;opacity:.08;pointer-events:none}
  .ml-hero-ring{position:absolute;width:220px;height:220px;border-radius:50%;border:1.5px solid rgba(255,255,255,.15);pointer-events:none}
  .ml-hero-ring::after{content:'';position:absolute;inset:-36px;border-radius:50%;border:1px solid rgba(255,255,255,.07)}
  .ml-logo{width:64px;height:64px;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:26px;color:#fff;margin-bottom:14px}
  .ml-hero h1{font-family:Syne,sans-serif;font-size:28px;color:#fff;margin:0 0 6px;letter-spacing:-.3px}
  .ml-hero p{color:rgba(255,255,255,.75);font-size:13px;font-weight:600;margin:0;text-align:center;line-height:1.5}

  /* Form bottom half */
  .ml-body{flex:1;padding:28px 22px 36px;display:flex;flex-direction:column;gap:0}
  .ml-body h2{font-family:Syne,sans-serif;font-size:20px;color:#0f172a;margin:0 0 20px;letter-spacing:-.2px}

  .ml-field{position:relative;margin-bottom:14px}
  .ml-field i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;pointer-events:none}
  .ml-field input{width:100%;height:50px;border:1.5px solid #e2e8f0;border-radius:14px;padding:0 14px 0 40px;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;color:#0f172a;background:#f8fafc;box-sizing:border-box;transition:border-color .18s,box-shadow .18s;outline:none}
  .ml-field input:focus{border-color:#1a6bff;box-shadow:0 0 0 3px rgba(26,107,255,.1);background:#fff}
  .ml-field input::placeholder{color:#94a3b8}

  .ml-forgot{text-align:right;margin:-6px 0 18px;font-size:12px;font-weight:700;color:#1a6bff;text-decoration:none;display:block}

  .ml-btn-primary{height:52px;background:#1a6bff;color:#fff;border:none;border-radius:999px;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:800;width:100%;cursor:pointer;transition:opacity .18s,transform .12s;letter-spacing:.1px}
  .ml-btn-primary:active{opacity:.88;transform:scale(.98)}

  .ml-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:#94a3b8;font-size:12px;font-weight:700}
  .ml-divider::before,.ml-divider::after{content:'';flex:1;height:1px;background:#e2e8f0}

  /* Google button */
  .ml-btn-google{height:52px;background:#fff;border:1.5px solid #e2e8f0;border-radius:999px;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;color:#0f172a;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color .18s,box-shadow .18s,transform .12s}
  .ml-btn-google:hover{border-color:#4285F4;box-shadow:0 2px 12px rgba(66,133,244,.15)}
  .ml-btn-google:active{transform:scale(.98)}
  .ml-btn-google svg{flex-shrink:0}
  .ml-google-host{min-height:52px;display:flex;justify-content:center;align-items:center}
  .ml-google-host > div{width:100%!important;display:flex;justify-content:center}

  .ml-footer{margin-top:24px;text-align:center;font-size:13px;font-weight:600;color:#64748b}
  .ml-footer a{color:#1a6bff;font-weight:800;text-decoration:none}
  .ml-back-home{margin-top:10px;height:48px;border-radius:999px;border:1.5px solid #cbd5e1;background:#fff;color:#334155;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none}

  #loginError{display:none;background:#fef2f2;border:1px solid #fca5a5;border-radius:12px;padding:10px 14px;color:#dc2626;font-size:13px;font-weight:600;margin-bottom:14px}
</style>
<script src="/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="ml-wrap">

  <!-- Hero -->
  <div class="ml-hero">
    <div class="ml-hero-bg"></div>
    <div class="ml-hero-ring"></div>
    <div class="ml-logo"><i class="fa-solid fa-bolt"></i></div>
    <h1>Welcome back</h1>
    <p>Log in to your Spopeer account<br>and connect with the sports world</p>
  </div>

  <!-- Form -->
  <div class="ml-body">
    <h2>Log In</h2>

    <div id="loginError"></div>

    <!-- Google button FIRST — prominent -->
    <div id="loginGoogleButton" class="ml-google-host" aria-label="Continue with Google"></div>

    <div class="ml-divider">or log in with email</div>

    <div class="ml-field">
      <i class="fa-regular fa-envelope"></i>
      <input id="email" type="email" placeholder="Email address" autocomplete="email">
    </div>
    <div class="ml-field">
      <i class="fa-solid fa-lock"></i>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    </div>

    <a href="/mobile-forgot-password.html" class="ml-forgot">Forgot password?</a>

    <button id="loginBtn" class="ml-btn-primary">Log In</button>

    <p class="ml-footer">Don't have an account? <a href="/mobile-signup.html">Create Account</a></p>
    <a href="/mobile.html" class="ml-back-home">Back to Home</a>
  </div>

</div>

<script src="/js/inline/mobile-login-inline-1.js"></script>

</body>
</html>
