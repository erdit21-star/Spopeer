<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Spopeer Mobile</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/mobile-app.css">
  <script src="/js/auth.js"></script>
  <script src="/js/sanitize.js"></script>
  <script src="/js/current-user-store.js"></script>
  <script src="/js/api.js"></script>
</head>
<body>
  <div id="spmApp" class="spm-app">
    <section id="spmSplash" class="spm-splash">
      <div class="spm-splash-bg"></div>
      <div class="spm-ring"></div>
      <div class="spm-brand-mark"><i class="fa-solid fa-bolt"></i></div>
      <h1>Spopeer</h1>
      <p>Your global sports network</p>
      <div class="spm-dots"><i></i><i></i><i></i></div>
    </section>

    <section id="spmAuth" class="spm-auth spm-hidden">
      <div class="spm-auth-hero">
        <div class="spm-brand-mark small"><i class="fa-solid fa-bolt"></i></div>
        <h1>Spopeer</h1>
        <p>Connect with athletes, coaches, clubs and the sports world.</p>
      </div>
      <div class="spm-auth-panel">
        <a class="spm-btn primary" href="/mobile-login.html">Sign In</a>
        <a class="spm-btn secondary" href="/mobile-signup.html">Sign Up</a>
      </div>
    </section>

    <main id="spmShell" class="spm-shell spm-hidden">
      <header class="spm-topbar">
        <button class="spm-icon-btn" data-back><i class="fa-solid fa-chevron-left"></i></button>
        <div><strong id="spmTitle">Feed</strong><span id="spmSubtitle">Sports network</span></div>
        <div style="display:flex;gap:6px">
          <button class="spm-icon-btn" data-route="notifications"><i class="fa-regular fa-bell"></i></button>
          <button class="spm-icon-btn" id="spmMenuBtn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        </div>
      </header>

      <!-- Slide-in drawer -->
      <div id="spmDrawerOverlay" class="spm-drawer-overlay"></div>
      <nav id="spmDrawer" class="spm-drawer">
        <div class="spm-drawer-header">
          <span class="spm-drawer-logo"><i class="fa-solid fa-bolt"></i> Spopeer</span>
          <button class="spm-icon-btn" id="spmMenuClose" onclick="document.getElementById('spmDrawer').classList.remove('spm-drawer-open');document.getElementById('spmDrawerOverlay').classList.remove('spm-drawer-open')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="spm-drawer-section">Main</div>
        <a class="spm-drawer-item" data-route="feed"><i class="fa-solid fa-house"></i> Home Feed</a>
        <a class="spm-drawer-item" data-route="search"><i class="fa-solid fa-magnifying-glass"></i> Search</a>
        <a class="spm-drawer-item" data-route="create"><i class="fa-solid fa-plus"></i> Create Post</a>
        <a class="spm-drawer-item" data-route="messages"><i class="fa-regular fa-comment-dots"></i> Messages</a>
        <a class="spm-drawer-item" data-route="notifications"><i class="fa-regular fa-bell"></i> Notifications</a>
        <div class="spm-drawer-section">Discover</div>
        <a class="spm-drawer-item" href="/public/pages/community/index.html"><i class="fa-solid fa-users"></i> Community</a>
        <a class="spm-drawer-item" href="/articles.html"><i class="fa-regular fa-newspaper"></i> Articles</a>
        <a class="spm-drawer-item" href="/search.html"><i class="fa-solid fa-person-running"></i> Athletes</a>
        <a class="spm-drawer-item" href="/connections.html"><i class="fa-solid fa-link"></i> Connections</a>
        <div class="spm-drawer-section">Account</div>
        <a class="spm-drawer-item" data-route="profile"><i class="fa-regular fa-user"></i> My Profile</a>
        <a class="spm-drawer-item spm-drawer-signout" id="spmDrawerSignOut"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</a>
      </nav>
      <section id="spmScreen" class="spm-screen"></section>
      <nav class="spm-tabbar">
        <button class="active" data-route="feed"><i class="fa-solid fa-house"></i><span>Home</span></button>
        <button data-route="search"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></button>
        <button class="create" data-route="create"><i class="fa-solid fa-plus"></i><span>Post</span></button>
        <button data-route="messages"><i class="fa-regular fa-comment-dots"></i><span>Chat</span></button>
        <button data-route="profile"><i class="fa-regular fa-user"></i><span>Profile</span></button>
      </nav>
    </main>
  </div>
  <script src="/js/mobile-app.js"></script>
</body>
</html>
