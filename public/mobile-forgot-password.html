<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Spopeer | Forgot Password</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/spopeer-pages.css">
</head>
<body>
  <div class="page-wrap">
    <header class="hero">
      <a class="back-link" href="/mobile-login.html">Back to Sign In</a>
      <span class="pill">Account Recovery</span>
      <h1 class="page-title">Forgot Password</h1>
      <p class="page-sub">Recover access securely. If your account exists, reset instructions will be sent to your inbox.</p>
    </header>
    <main class="content">
      <section class="card">
        <div id="fpError" class="error-box"></div>
        <div id="fpSuccess" class="success-box"></div>
        <label class="label" for="email">Email address</label>
        <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <button id="submitBtn" class="btn btn-primary" style="width:100%;margin-top:12px">Send Reset Link</button>
        <p class="footer-note">Endpoint: POST /api/auth/forgot-password. The reset link expires in 30 minutes.</p>
      </section>
    </main>
  </div>
<script>
  document.getElementById('submitBtn').addEventListener('click', async function () {
    var btn = this;
    var email = document.getElementById('email').value.trim();
    var errorBox = document.getElementById('fpError');
    var successBox = document.getElementById('fpSuccess');
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    if (!email) {
      errorBox.textContent = 'Please enter your email address.';
      errorBox.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
      var res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok) throw new Error((data.error && data.error.message) || 'Could not send reset instructions.');
      successBox.textContent = 'If an account exists for ' + email + ', reset instructions were sent. Check inbox and spam.';
      successBox.style.display = 'block';
    } catch (err) {
      errorBox.textContent = err.message || 'Network error. Please try again.';
      errorBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    }
  });
</script>
</body>
</html>
