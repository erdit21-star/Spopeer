<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Forgot Password - Spopeer Mobile</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} body{margin:0;background:#eef3fb;font-family:'Plus Jakarta Sans',sans-serif;color:#0f172a}
    .wrap{max-width:520px;min-height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column}
    .hero{padding:22px 18px;background:linear-gradient(145deg,#001f3f,#1a6bff);color:#fff}
    .back{display:inline-flex;align-items:center;gap:8px;color:#dbeafe;text-decoration:none;font-weight:700;font-size:13px;margin-bottom:16px}
    .hero h1{font-family:Syne,sans-serif;font-size:28px;line-height:1.15;margin:0 0 8px}
    .hero p{margin:0;opacity:.9;font-weight:600;font-size:13px;line-height:1.5}
    .card{margin:16px;border:1px solid #e2e8f0;border-radius:16px;background:#fff;padding:16px}
    .field{display:flex;flex-direction:column;gap:8px}
    .field label{font-size:13px;font-weight:700;color:#334155}
    .field input{height:48px;border:1.5px solid #e2e8f0;border-radius:12px;padding:0 12px;font-size:15px}
    .btn{height:48px;border:0;border-radius:999px;background:#1a6bff;color:#fff;width:100%;font-weight:800;margin-top:12px}
    .hint{font-size:12px;color:#64748b;line-height:1.6;margin-top:10px}
    .error{display:none;margin-top:10px;padding:10px;border-radius:10px;border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;font-size:13px;font-weight:700}
    .success{display:none;margin-top:10px;padding:12px;border-radius:10px;border:1px solid #86efac;background:#ecfdf5;color:#166534;font-size:13px;font-weight:700;line-height:1.5}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <a class="back" href="/mobile-login.html">Back to Sign In</a>
      <h1>Password Recovery</h1>
      <p>Enter your email and we will send secure reset instructions.</p>
    </section>
    <section class="card">
      <form id="forgotForm">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button id="submitBtn" class="btn" type="submit">Send Reset Link</button>
        <p class="hint">If an account exists, you will receive an email with a reset link. The link expires in 30 minutes.</p>
        <div id="fpError" class="error"></div>
        <div id="fpSuccess" class="success"></div>
      </form>
    </section>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errorBox = document.getElementById('fpError');
      const successBox = document.getElementById('fpSuccess');
      const submitBtn = document.getElementById('submitBtn');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      if (!email) {
        errorBox.textContent = 'Please enter your email.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        const data = await res.json().catch(function () { return {}; });
        if (!res.ok) {
          const msg = (data.error && data.error.message) || 'Could not send reset instructions. Please try again.';
          throw new Error(msg);
        }

        successBox.textContent = 'If an account exists for ' + email + ', we have sent reset instructions. Please check your inbox and spam folder.';
        successBox.style.display = 'block';
      } catch (error) {
        errorBox.textContent = error.message || 'Network error. Please try again.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
