<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Spopeer | Forgot Password</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/spopeer-pages.css">
  <style>
    .fp-intro{border:1px solid #dbeafe;background:linear-gradient(135deg,#eff6ff,#ffffff);border-radius:18px;padding:14px;margin-bottom:4px}
    .fp-intro p{margin:0;color:#334155;font-size:13px;line-height:1.7;font-weight:600}
    .fp-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
    .fp-step{border:1px solid #e2e8f0;border-radius:12px;padding:10px;background:#fff;text-align:center}
    .fp-step span{display:block;font-size:10px;color:#1d4ed8;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
    .fp-step p{margin:0;font-size:12px;color:#475569;font-weight:600;line-height:1.4}
  </style>
</head>
<body>
  <div class="page-wrap">
    <header class="hero">
      <span class="pill">Account Recovery</span>
      <h1 class="page-title">Forgot Password</h1>
      <p class="page-sub">Enter your email and a secure reset link will be on its way in seconds.</p>
    </header>
    <main class="content">
      <section class="card">
        <div class="fp-intro">
          <p>Enter the email tied to your Spopeer account. The reset link expires in <strong>30 minutes</strong> and can only be used once.</p>
          <div class="fp-steps">
            <div class="fp-step"><span>Step 1</span><p>Enter your email</p></div>
            <div class="fp-step"><span>Step 2</span><p>Check inbox</p></div>
            <div class="fp-step"><span>Step 3</span><p>Set new password</p></div>
          </div>
        </div>
        <div id="fpError" class="error-box"></div>
        <div id="fpSuccess" class="success-box"></div>
        <label class="label" for="email">Email address</label>
        <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <button id="submitBtn" class="btn btn-primary" style="width:100%;margin-top:12px">Send Reset Link</button>
      </section>
    </main>
  </div>
<script src="/js/inline/mobile-forgot-password-inline-1.js"></script>
</body>
</html>
