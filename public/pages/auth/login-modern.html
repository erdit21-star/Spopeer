<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In · Spopeer</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/styles.css" />
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: linear-gradient(135deg, #f1f5f9 0%, #e9f0f8 100%);
    }

    .login-box {
      background: white;
      border-radius: 32px;
      padding: 48px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
      max-width: 450px;
      width: 100%;
      border: 1px solid #f0f4fa;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0a0c10;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 0.95rem;
      color: #5b7385;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      color: #1a2938;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e0e7f0;
      border-radius: 20px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: 0.2s;
      background: #f8fbfe;
    }

    .form-group input:focus {
      outline: none;
      background: white;
      border-color: #1c2d3f;
      box-shadow: 0 0 0 3px rgba(28, 45, 63, 0.1);
    }

    .form-group.with-icon {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group.with-icon a {
      color: #1c2d3f;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .form-group.with-icon a:hover {
      text-decoration: underline;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #5b7385;
      margin-bottom: 24px;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #1c2d3f;
      color: white;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 6px 18px rgba(23, 45, 70, 0.12);
    }

    .login-btn:hover {
      background: #13212f;
      transform: translateY(-2px);
    }

    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: #5b7385;
    }

    .signup-link a {
      color: #1c2d3f;
      text-decoration: none;
      font-weight: 700;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .social-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      font-size: 0.85rem;
      color: #8c9aa8;
    }

    .social-divider::before,
    .social-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e0e7f0;
    }

    .social-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-btn {
      padding: 10px;
      border: 1px solid #e0e7f0;
      border-radius: 20px;
      background: #f8fbfe;
      color: #1a2938;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .social-btn:hover {
      background: white;
      border-color: #1c2d3f;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 32px 20px;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }

      .social-buttons {
        grid-template-columns: 1fr;
      }
    }
  .logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-mark {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.logo-mark img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.logo-text {
  font-family: var(--fd, var(--font-display, var(--fD, sans-serif)));
  font-size: 20px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -.03em;
}
</style>
  <script src="/js/auth.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/api.js"></script>
  <script>
    window.Auth.redirectIfLoggedInToUserApp();
  </script>
  <link rel="stylesheet" href="/css/fonts.css">

  <link rel="stylesheet" href="../../css/mobile-responsive.css">
  <script src="../../js/mobile-enhancements.js" defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/index.html" class="logo" data-home-link>
        <span class="logo-mark"><img src="/assets/images/logo-s.jpg" alt="Spopeer"></span>
        <span class="logo-text">Spopeer</span>
      </a>
      <div class="search-wrapper" style="display: none;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search...">
      </div>
      <div class="header-actions">
        <a href="/pages/auth/signup.html" class="icon-btn" title="Sign Up" style="font-weight: 600; color: #1c2d3f;"><i class="fa-solid fa-user-plus"></i> Sign Up</a>
      </div>
    </div>
  </header>

  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Log in to your Spopeer account</p>
      </div>

      <div class="social-buttons">
        <button class="social-btn" type="button" disabled title="Coming soon" style="opacity:0.5;cursor:not-allowed;"><i class="fa-brands fa-google"></i> Google — coming soon</button>
        <button class="social-btn" type="button" disabled title="Coming soon" style="opacity:0.5;cursor:not-allowed;"><i class="fa-brands fa-apple"></i> Apple — coming soon</button>
      </div>

      <div class="social-divider">OR</div>

      <form id="loginForm">
        <div id="loginErrorModern" style="display:none;margin-bottom:16px;padding:10px 12px;border-radius:10px;background:#fee2e2;color:#991b1b;font-size:13px;font-weight:600;"></div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group with-icon">
          <div style="width: 100%;">
            <label>Password</label>
            <input type="password" placeholder="••••••••" required style="margin-bottom: 0;">
          </div>
          <a href="forgot-password.html">Forgot?</a>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="remember">
          <label for="remember" style="margin: 0;">Remember me</label>
        </div>

        <button type="submit" class="login-btn">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Log In
        </button>
      </form>

      <div class="signup-link">
        Don't have an account? <a href="/pages/auth/signup.html">Sign Up</a>
      </div>
    </div>
  </div>
  <script>
    function handleSocialLogin(provider) {
      API.showNotification(`Social login with ${provider.charAt(0).toUpperCase() + provider.slice(1)} is not yet available. Please use email/password to log in.`, 'info');
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const errorBox = document.getElementById('loginErrorModern');
      const loginBtn = form.querySelector('.login-btn');
      const email = form.querySelector('input[type="email"]').value.trim();
      const password = form.querySelector('input[type="password"]').value.trim();

      if (errorBox) {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      if (!email || !password) {
        if (errorBox) {
          errorBox.textContent = 'Please fill in both email and password.';
          errorBox.style.display = 'block';
        }
        return;
      }

      if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';
      }

      try {
        const result = await window.SpopeerAPI.login({ email: email, password: password });
        const user = (result.data && result.data.user) || result.user;
        if (user) window.Auth.login(user);
        window.location.href = '/feed.html';
      } catch (err) {
        if (errorBox) {
          errorBox.textContent = err.message || 'Login failed.';
          errorBox.style.display = 'block';
        }
      } finally {
        if (loginBtn) {
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Log In';
        }
      }
    });
  </script>
<script src="/js/navigation.js"></script>
</body>
</html>
