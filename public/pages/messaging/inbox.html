  <style>
    /* Inbox-specific token overrides */
    :root{--sidebar-w:320px;--accent-mid:#003366;--accent-hover:#001428;--accent-light:#cce7ff;--accent-lt2:#e8f4ff;--rS:7px;--rL:16px;}
    html,body{height:100%;overflow:hidden}
    body{display:flex;flex-direction:column;}

    /* Inbox nav overrides – full-width, non-sticky */
    .topnav{position:static;background:var(--white);backdrop-filter:none;flex-shrink:0;z-index:200;}
    .nav-inner{max-width:100%;gap:14px;}
    .nav-title{font-family:var(--fD);font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
    .btn-back{padding:7px 15px;border:1.5px solid var(--border);border-radius:var(--pill);background:transparent;color:var(--muted);font-size:13px;font-weight:600;font-family:var(--fB);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:.2s;}
    .btn-back:hover{border-color:var(--accent);color:var(--accent);}

    /* ── MESSAGING LAYOUT ── */
    .messaging-layout{flex:1;display:grid;grid-template-columns:var(--sidebar-w) 1fr;overflow:hidden;}

    /* ── LEFT PANEL ── */
    .panel-left{border-right:1px solid var(--border);background:var(--white);display:flex;flex-direction:column;overflow:hidden;}
    .panel-left-head{padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
    .panel-left-title{font-family:var(--fD);font-size:16px;font-weight:800;color:var(--ink);margin-bottom:10px;}
    .search-wrap{position:relative;}
    .search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none;}
    .search-wrap input{width:100%;padding:9px 12px 9px 32px;background:var(--surface);border:1.5px solid transparent;border-radius:var(--pill);font-size:13px;font-family:var(--fB);color:var(--ink);transition:.2s;}
    .search-wrap input::placeholder{color:var(--muted-2);}
    .search-wrap input:focus{outline:none;background:var(--white);border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,31,63,.08);}
    .conv-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
    .conv-list::-webkit-scrollbar{width:4px;}
    .conv-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
    .conv-item{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer;transition:.15s;border-bottom:1px solid var(--border);position:relative;}
    .conv-item:last-child{border-bottom:none;}
    .conv-item:hover{background:var(--accent-lt2);}
    .conv-item.active{background:var(--accent-lt2);border-right:3px solid var(--accent);}
    .conv-av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-light);font-size:15px;font-weight:800;font-family:var(--fD);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
    .online-dot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;background:#22c55e;border-radius:50%;border:2px solid var(--white);}
    .conv-info{flex:1;min-width:0;}
    .conv-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .conv-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300;}
    .conv-preview.unread-preview{color:var(--ink-2);font-weight:600;}
    .conv-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
    .conv-time{font-size:11px;color:var(--muted-2);}
    .unread-badge{background:var(--accent);color:var(--accent-light);font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:var(--pill);display:flex;align-items:center;justify-content:center;padding:0 4px;}
    .conv-empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:13px;}
    .conv-empty i{font-size:32px;color:var(--muted-2);margin-bottom:10px;display:block;}

    /* new message btn */
    .new-msg-btn{margin:12px 18px;padding:11px;background:var(--accent);color:var(--accent-light);border:none;border-radius:var(--r);font-size:13px;font-weight:700;font-family:var(--fB);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s;flex-shrink:0;}
    .new-msg-btn:hover{background:var(--accent-hover);}

    /* ── RIGHT PANEL ── */
    .panel-right{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}

    /* chat header */
    .chat-head{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--white);display:flex;align-items:center;gap:12px;flex-shrink:0;}
    .chat-head-av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-light);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .chat-head-info{flex:1;min-width:0;}
    .chat-head-name{font-size:15px;font-weight:700;color:var(--ink);}
    .chat-head-status{font-size:12px;color:var(--green);display:flex;align-items:center;gap:4px;}
    .chat-head-status i{font-size:8px;}
    .chat-head-actions{display:flex;gap:4px;}
    .head-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;}
    .head-btn:hover{background:var(--surface);color:var(--ink);}

    /* empty state */
    .chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);padding:32px;}
    .chat-empty i{font-size:48px;color:var(--muted-2);}
    .chat-empty h3{font-family:var(--fD);font-size:18px;font-weight:800;color:var(--ink);}
    .chat-empty p{font-size:14px;color:var(--muted);text-align:center;max-width:280px;line-height:1.6;font-weight:300;}

    /* messages area */
    .msg-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
    .msg-area::-webkit-scrollbar{width:4px;}
    .msg-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

    .date-sep{text-align:center;margin:6px 0;}
    .date-sep span{font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);padding:3px 10px;border-radius:var(--pill);border:1px solid var(--border);}

    /* message bubbles */
    .msg-row{display:flex;gap:9px;max-width:72%;align-items:flex-end;}
    .msg-row.mine{align-self:flex-end;flex-direction:row-reverse;}
    .msg-row.theirs{align-self:flex-start;}
    .msg-av-sm{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-light);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .bubble{padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.55;word-break:break-word;position:relative;}
    .mine .bubble{background:var(--accent);color:var(--accent-light);border-bottom-right-radius:4px;}
    .theirs .bubble{background:var(--white);color:var(--ink-2);border:1px solid var(--border);border-bottom-left-radius:4px;}
    .bubble-meta{font-size:10px;margin-top:4px;text-align:right;}
    .mine .bubble-meta{color:rgba(204,231,255,.65);}
    .theirs .bubble-meta{color:var(--muted-2);}
    .read-check{margin-left:3px;}

    /* unread chip */
    .unread-chip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:4px 0;}
    .unread-chip::before,.unread-chip::after{content:'';flex:1;height:1px;background:var(--border);}

    /* compose */
    .compose-area{padding:14px 18px;border-top:1px solid var(--border);background:var(--white);flex-shrink:0;}
    .compose-inner{display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rL);padding:10px 12px;transition:.2s;}
    .compose-inner:focus-within{border-color:var(--accent);background:var(--white);box-shadow:0 0 0 3px rgba(0,31,63,.08);}
    .compose-tools{display:flex;gap:2px;}
    .tool-btn{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;}
    .tool-btn:hover{background:var(--surface-2);color:var(--ink);}
    #messageText{flex:1;border:none;background:transparent;font-size:14px;font-family:var(--fB);color:var(--ink);resize:none;outline:none;max-height:120px;line-height:1.5;padding:3px 0;}
    #messageText::placeholder{color:var(--muted-2);}
    .send-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-light);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;}
    .send-btn:hover{background:var(--accent-hover);}
    .send-btn:disabled{opacity:.4;cursor:not-allowed;}

    /* new message modal overlay */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:400;display:flex;align-items:center;justify-content:center;display:none;}
    .modal-overlay.open{display:flex;}
    .modal-box{background:var(--white);border-radius:var(--rL);padding:24px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.15);}
    .modal-title{font-family:var(--fD);font-size:18px;font-weight:800;color:var(--ink);margin-bottom:16px;}
    .modal-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:14px;font-family:var(--fB);color:var(--ink);background:var(--surface);transition:.2s;margin-bottom:12px;}
    .modal-input:focus{outline:none;border-color:var(--accent);background:var(--white);}
    .modal-btns{display:flex;gap:8px;justify-content:flex-end;}
    .btn-cancel{padding:9px 18px;border:1.5px solid var(--border);border-radius:var(--r);background:transparent;color:var(--muted);font-size:13px;font-weight:600;font-family:var(--fB);cursor:pointer;transition:.2s;}
    .btn-cancel:hover{border-color:var(--ink);color:var(--ink);}
    .btn-start{padding:9px 20px;background:var(--accent);color:var(--accent-light);border:none;border-radius:var(--r);font-size:13px;font-weight:700;font-family:var(--fB);cursor:pointer;transition:.2s;}
    .btn-start:hover{background:var(--accent-hover);}

    /* typing indicator */
    .typing-indicator{display:none;padding:0 20px 6px;font-size:12px;color:var(--muted);font-style:italic;}

    @media(max-width:768px){
      .messaging-layout{grid-template-columns:1fr;}
      .panel-left{display:none;}
      .panel-left.mobile-open{display:flex;position:fixed;inset:0;top:var(--nav-h);z-index:300;}
    }
  .logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;

.logo-text {

  font-size: 20px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -.03em;
}
</style>

<!-- MESSAGING LAYOUT -->
<div class="messaging-layout">

  <!-- LEFT: CONVERSATION LIST -->
  <div class="panel-left" id="panelLeft">
    <div class="panel-left-head">
      <div class="panel-left-title">Conversations</div>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="convSearch" placeholder="Search messages…"/>
      </div>
    </div>

    <div class="conv-list" id="conversationsList">
      <div class="conv-empty">
        <i class="fa-regular fa-comments"></i>
        <div>Loading conversations…</div>
      </div>
    </div>

    <button class="new-msg-btn" id="newMsgBtn">
      <i class="fa-solid fa-pen-to-square" style="font-size:13px"></i> New Message
    </button>
  </div>

  <!-- RIGHT: CHAT PANEL -->
  <div class="panel-right" id="panelRight">

    <!-- empty state (shown when no convo selected) -->
    <div class="chat-empty" id="chatEmpty">
      <i class="fa-regular fa-comments"></i>
      <h3>Your Messages</h3>
      <p>Select a conversation from the list, or start a new message to connect with athletes, coaches, and clubs.</p>
      <button class="new-msg-btn" style="max-width:200px;margin-top:8px" onclick="document.getElementById('newMsgModal').classList.add('open')">
        <i class="fa-solid fa-pen-to-square" style="font-size:13px"></i> New Message
      </button>
    </div>

    <!-- chat (hidden until conversation selected) -->
    <div id="chatActive" style="display:none;flex:1;flex-direction:column;overflow:hidden;display:none">

      <!-- chat header -->
      <div class="chat-head">
        <div class="chat-head-av" id="chatHeadAv">?</div>
        <div class="chat-head-info">
          <div class="chat-head-name" id="chatHeadName">User</div>
          <div class="chat-head-status" id="chatHeadStatus">
            <i class="fa-solid fa-circle"></i> Online
          </div>
        </div>
        <div class="chat-head-actions">
          <button class="head-btn" title="View Profile" onclick="viewProfile()"><i class="fa-regular fa-user"></i></button>
          <button class="head-btn" title="Search in conversation"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button class="head-btn" title="More options"><i class="fa-solid fa-ellipsis"></i></button>
        </div>
      </div>

      <!-- messages -->
      <div class="msg-area" id="messages"></div>
      <div class="typing-indicator" id="typingIndicator">User is typing…</div>

      <!-- compose -->

            <button class="tool-btn" title="Attach file"><i class="fa-solid fa-paperclip"></i></button>
            <button class="tool-btn" title="Add emoji"><i class="fa-regular fa-face-smile"></i></button>
          </div>
          <textarea id="messageText" rows="1" placeholder="Write a message…"></textarea>
          <button class="send-btn" id="sendBtn" disabled title="Send">
            <i class="fa-solid fa-paper-plane" style="font-size:14px"></i>
          </button>
        </div>

    </div>
  </div>
</div>

<script src="../../js/profile-sync-service.js"></script>
  <script src="../../js/shared-ui.js"></script>
  <script>
(function(){
  /* ── User hydration ── */
  const ud=JSON.parse(localStorage.getItem('spopeer_user')||'null');
  if(ud&&ud.name){
    const init=ud.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
    const first=ud.name.split(' ')[0];
    const av=document.getElementById('chipAvatar');const nm=document.getElementById('chipName');
    if(av)av.textContent=init;if(nm)nm.textContent=first;
  }

  const _loggedIn=localStorage.getItem('spopeer_loggedIn')==='true';
  let currentConversation=null;
  let myInitials='??';
  let allConvs=[];

  /* ── Helper: Escape HTML ── */
  function escHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}

  /* get userId from stored profile */
  function getMe(){
    if(!ud)return null;
    return String(ud.id||ud.userId||'');
  }
  const me=getMe();
  if(me){myInitials=(me.slice(0,2).toUpperCase());}
  if(ud&&ud.name){myInitials=ud.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);}

  /* ── Avatar initials helper ── */
  function initFor(id){return String(id||'?').slice(0,2).toUpperCase();}

  /* ── Get user name from profiles ── */
  function getOtherUserName(email){
    if(!email) return 'User';
    const profiles = JSON.parse(localStorage.getItem('spopeer_profiles')||'{}');
    const profile = profiles[email];
    if(profile && profile.firstName){
      return profile.firstName + ' ' + (profile.lastName || '');
    }
    return 'User ' + (String(email).substring(0,2).toUpperCase());
  }

  /* ── Format time ── */
  function fmtTime(iso){
    const d=new Date(iso);const now=new Date();
    const diff=(now-d)/1000;
    if(diff<60)return 'now';
    if(diff<3600)return Math.floor(diff/60)+'m';
    if(diff<86400)return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString([],{month:'short',day:'numeric'});
  }

  /* ── Render conversation list ── */
  function renderConvList(convs){
    const list=document.getElementById('conversationsList');
    if(!convs||!convs.length){
      list.innerHTML='<div class="conv-empty"><i class="fa-regular fa-comment-slash"></i><div style="margin-top:8px">No conversations yet</div><div style="font-size:12px;margin-top:4px;color:var(--muted-2)">Start a new message to connect</div></div>';
      return;
    }
    list.innerHTML='';
    convs.forEach(c=>{
      const div=document.createElement('div');
      div.className='conv-item'+(currentConversation&&currentConversation===String(c.otherId||c.id)?' active':'');
      div.dataset.other=c.otherId||c.id;
      const unread=c.unread&&c.unread>0;
      const name = c.otherName || c.firstName + ' ' + (c.lastName||'') || 'User ' + (c.otherId||c.id);
      div.innerHTML=`
        <div class="conv-av">${initFor(c.otherId||c.id)}${(c.online||Math.random()>0.7)?'<span class="online-dot"></span>':''}</div>
        <div class="conv-info">
          <div class="conv-name">${name}</div>
          <div class="conv-preview ${unread?'unread-preview':''}">${c.lastMessage?escHtml(c.lastMessage.slice(0,60)):''}</div>
        </div>
        <div class="conv-right">
          <div class="conv-time">${c.lastAt?fmtTime(c.lastAt):''}</div>
          ${unread?`<div class="unread-badge">${c.unread}</div>`:''}
        </div>`;
      div.addEventListener('click',()=>openConversation(c.otherId||c.id||c.email));
      list.appendChild(div);
    });
  }

  /* ── Load conversations ── */
  async function loadConversations(){
    if(!_loggedIn&&!ud){renderConvList([]);return;}
    
    const userEmail = ud?.email || 'user@example.com';
    
    try{
      // Try API first
      const r=await fetch('/api/messages/conversations',{credentials:'include'});
      if(r.ok){
        allConvs=await r.json();
        renderConvList(allConvs);
        return;
      }
    }catch(e){
      console.error('Failed to load conversations:', e);
    }

    renderConvList([]);
  }

  /* ── Open conversation ── */
  async function openConversation(otherId){
    if(!me){alert('Please log in to use messaging');return;}
    currentConversation=String(otherId);

    /* update list active state */
    document.querySelectorAll('.conv-item').forEach(i=>{i.classList.toggle('active',i.dataset.other===String(otherId));});

    /* show chat panel */
    document.getElementById('chatEmpty').style.display='none';
    const ca=document.getElementById('chatActive');ca.style.display='flex';ca.style.flexDirection='column';ca.style.flex='1';ca.style.overflow='hidden';

    /* header */
    const otherName = getOtherUserName(otherId);
    document.getElementById('chatHeadAv').textContent=initFor(otherId);
    document.getElementById('chatHeadName').textContent=otherName;

    /* enable send */
    document.getElementById('sendBtn').disabled=false;

    /* load messages */
    const userEmail = ud?.email || 'user@example.com';
    try{
      const r=await fetch('/api/messages/conversation/'+encodeURIComponent(me)+'/'+encodeURIComponent(otherId),{credentials:'include'});
      if(r.ok){
        const data=await r.json();
        renderMessages(data,String(me));
        return;
      }
    }catch(e){
      console.error('Failed to load conversation:', e);
    }

    renderMessages([],String(me));
  }

  /* ── Render messages ── */
  function renderMessages(msgs,myId){
    const box=document.getElementById('messages');
    box.innerHTML='';
    if(!msgs||!msgs.length){
      box.innerHTML='<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;padding:32px;text-align:center">No messages yet. Say hello!</div>';
      return;
    }
    let lastDate='';
    msgs.forEach(m=>{
      // Support current API shape and legacy message fields.
      const sender = m.fromId || m.sender;
      const content = m.text || m.content;
      const createdAt = m.createdAt || m.timestamp || new Date().toISOString();
      
      const mDate=new Date(createdAt).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'});
      if(mDate!==lastDate){
        const sep=document.createElement('div');sep.className='date-sep';sep.innerHTML=`<span>${mDate}</span>`;box.appendChild(sep);
        lastDate=mDate;
      }
      
      const isMe=String(sender)===myId||String(sender)===String(myId).split('@')[0];
      const row=document.createElement('div');
      row.className='msg-row '+(isMe?'mine':'theirs');
      const unread = m.read === 0 || m.read === false;
      const meta=new Date(createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+(unread&&!isMe?' · <span class="unread-mark">unread</span>':'');
      if(!isMe){
        row.innerHTML=`<div class="msg-av-sm">${initFor(sender)}</div><div><div class="bubble">${escHtml(content||'')}</div><div class="bubble-meta">${meta}</div></div>`;
      }else{
        row.innerHTML=`<div><div class="bubble">${escHtml(content||'')}</div><div class="bubble-meta">${meta}</div></div>`;
      }
      box.appendChild(row);
    });
    box.scrollTop=box.scrollHeight;
  }

  /* ── Send message ── */
  async function sendMessage(){
    if(!currentConversation)return;
    const text=document.getElementById('messageText').value.trim();
    if(!text)return;
    
    const userEmail = ud?.email || 'user@example.com';
    
    try{
      const r=await fetch('/api/messages/send',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({toId:currentConversation,text})});
      if(r.ok){
        document.getElementById('messageText').value='';
        document.getElementById('sendBtn').disabled=true;
        openConversation(currentConversation);
        return;
      }
    }catch(e){
      console.error('Failed to send message:', e);
    }
    
    alert('Error sending message');
  }

  document.getElementById('sendBtn').addEventListener('click',sendMessage);
  document.getElementById('messageText').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
  });
  document.getElementById('messageText').addEventListener('input',function(){
    document.getElementById('sendBtn').disabled=!this.value.trim();
    this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';
  });

  /* ── New message modal ── */
  document.getElementById('newMsgBtn').addEventListener('click',()=>document.getElementById('newMsgModal').classList.add('open'));
  document.getElementById('newMsgModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
  document.getElementById('startConvBtn').addEventListener('click',async function(){
    const otherId=document.getElementById('newMsgTo').value.trim();
    const firstMsg=document.getElementById('newMsgFirstMsg').value.trim();
    if(!otherId){alert('Enter a user ID or email');return;}
    document.getElementById('newMsgModal').classList.remove('open');
    document.getElementById('newMsgTo').value='';
    document.getElementById('newMsgFirstMsg').value='';
    
    if(firstMsg){
      try {
        await fetch('/api/messages/send',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({toId:otherId,text:firstMsg})});
      } catch (e) {
        console.error('Failed to send initial message:', e);
      }
      loadConversations();
    }
    openConversation(otherId);
  });

  /* ── Search filter ── */
  document.getElementById('convSearch').addEventListener('input',function(){
    const q=this.value.toLowerCase();
    document.querySelectorAll('.conv-item').forEach(item=>{
      const name=item.querySelector('.conv-name')?.textContent.toLowerCase()||'';
      const preview=item.querySelector('.conv-preview')?.textContent.toLowerCase()||'';
      item.style.display=(name.includes(q)||preview.includes(q))?'':'none';
    });
  });

  /* ── View profile helper ── */
  window.viewProfile=function(){if(currentConversation)window.location.href='../../pages/profiles/public-profile.html?userId='+encodeURIComponent(currentConversation);};

  /* ── Socket.io realtime ── */
  if(window.io){
    try{
      const socket=io();
      if(me)socket.emit('register',String(me));
      socket.on('new_message',function(msg){
        loadConversations();
        if(currentConversation&&(String(msg.fromId)===currentConversation||String(msg.toId)===currentConversation)){
          openConversation(currentConversation);
        }
      });
    }catch(e){}
  }

  /* ── Escape HTML ── */
  function escHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}

  /* ── Init ── */
  loadConversations();

  /* ── Open conversation from URL param ── */
  const urlOther=new URLSearchParams(window.location.search).get('userId')||new URLSearchParams(window.location.search).get('otherId');
  if(urlOther)openConversation(urlOther);

})();
</script>
<script>
  if (window.sharedUi && window.sharedUi.setupSocialFeedRuntime) {
    window.sharedUi.setupSocialFeedRuntime({ basePath: '../../' });
  }
</script>
<script src="/js/navigation.js"></script>
</body>
</html>
