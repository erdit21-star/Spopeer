<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forums - Spopeer</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--bg:#0a0a0f;--card:#14141c;--border:#23233a;--ink:#e8e8ed;--muted:#8b8b9e;--accent:#6C5CE7;--accent2:#00CFFD;--green:#22c55e;--red:#ef4444;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
    .page-wrap{max-width:900px;margin:0 auto;padding:20px}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .page-header h1{font-size:24px;font-weight:800}
    .page-header a{color:var(--muted);text-decoration:none;font-size:14px}
    .page-header a:hover{color:var(--ink)}
    .btn-primary{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer}
    .btn-primary:hover{opacity:.9}
    .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius);font-size:13px;cursor:pointer}
    .btn-secondary:hover{color:var(--ink);border-color:var(--muted)}

    /* Filters */
    .filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .filter-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer}
    .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .search-box{flex:1;min-width:200px;background:var(--card);border:1px solid var(--border);color:var(--ink);padding:8px 14px;border-radius:20px;font-size:13px;outline:none}
    .search-box:focus{border-color:var(--accent)}

    /* Thread list */
    .thread-list{display:flex;flex-direction:column;gap:2px}
    .thread-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;cursor:pointer;transition:border-color .2s}
    .thread-card:hover{border-color:var(--accent)}
    .thread-card.pinned{border-left:3px solid var(--accent)}
    .thread-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .thread-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
    .thread-meta{font-size:12px;color:var(--muted)}
    .thread-meta span{margin-right:8px}
    .thread-title{font-size:16px;font-weight:700;margin-bottom:4px}
    .thread-preview{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .thread-stats{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--muted)}
    .thread-stats i{margin-right:4px}
    .thread-tag{background:rgba(108,92,231,.15);color:var(--accent);padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}

    /* Thread detail */
    .thread-detail{display:none}
    .thread-detail.visible{display:block}
    .thread-body{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
    .thread-body h2{font-size:22px;margin-bottom:12px}
    .thread-body .body-text{font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap}
    .thread-body .author-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}

    /* Replies */
    .replies-section h3{font-size:16px;font-weight:700;margin-bottom:12px}
    .reply-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:8px}
    .reply-card .reply-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .reply-card .reply-body{font-size:14px;line-height:1.6}
    .reply-card .reply-time{font-size:11px;color:var(--muted)}

    /* New thread / reply form */
    .compose-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
    .compose-form input,.compose-form textarea,.compose-form select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--ink);padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:12px;resize:vertical;outline:none;font-family:inherit}
    .compose-form input:focus,.compose-form textarea:focus{border-color:var(--accent)}
    .compose-form textarea{min-height:120px}
    .compose-row{display:flex;gap:10px}
    .compose-row select{flex:1}

    .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty-state i{font-size:36px;display:block;margin-bottom:12px}
    .back-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;margin-bottom:16px;padding:0}
    .back-btn:hover{color:var(--ink)}

    /* Reply composer at bottom */
    .reply-compose{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px}
    .reply-compose textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--ink);padding:10px;border-radius:8px;font-size:14px;min-height:80px;resize:vertical;outline:none;font-family:inherit;margin-bottom:10px}
    .reply-compose textarea:focus{border-color:var(--accent)}
  </style>
  <link rel="stylesheet" href="/css/fonts.css">

  <link rel="stylesheet" href="../../css/mobile-responsive.css">
  <script src="../../js/mobile-enhancements.js" defer></script>
</head>
<body>
  <div class="page-wrap">
    <!-- LIST VIEW -->
    <div id="listView">
      <div class="page-header">
        <h1><i class="fa-solid fa-comments"></i> Forums</h1>
        <div style="display:flex;gap:10px;align-items:center">
          <a href="/feed.html"><i class="fa-solid fa-arrow-left"></i> Home</a>
          <button class="btn-primary" onclick="showCompose()"><i class="fa-solid fa-plus"></i> New Thread</button>
        </div>
      </div>

      <!-- Compose form (hidden by default) -->
      <div class="compose-form" id="composeForm" style="display:none">
        <input type="text" id="threadTitle" placeholder="Thread title..." maxlength="300">
        <div class="compose-row">
          <select id="threadCategory">
            <option value="General">General Discussion</option>
            <option value="Training">Training & Fitness</option>
            <option value="Nutrition">Nutrition</option>
            <option value="Injuries">Injuries & Recovery</option>
            <option value="Equipment">Equipment & Gear</option>
            <option value="Events">Events & Competitions</option>
            <option value="Careers">Career & Opportunities</option>
            <option value="Off-Topic">Off-Topic</option>
          </select>
          <select id="threadSport">
            <option value="">Any Sport</option>
            <option value="Running">Running</option>
            <option value="Football">Football</option>
            <option value="Basketball">Basketball</option>
            <option value="Tennis">Tennis</option>
            <option value="Swimming">Swimming</option>
            <option value="Cycling">Cycling</option>
            <option value="Boxing">Boxing</option>
            <option value="Cricket">Cricket</option>
            <option value="Gym">Gym & Fitness</option>
            <option value="Yoga">Yoga</option>
          </select>
        </div>
        <textarea id="threadBody" placeholder="Write your thread..."></textarea>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn-secondary" onclick="hideCompose()">Cancel</button>
          <button class="btn-primary" onclick="createThread()">Post Thread</button>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <button class="filter-btn active" data-cat="">All</button>
        <button class="filter-btn" data-cat="Training">Training</button>
        <button class="filter-btn" data-cat="Nutrition">Nutrition</button>
        <button class="filter-btn" data-cat="Injuries">Injuries</button>
        <button class="filter-btn" data-cat="Equipment">Equipment</button>
        <button class="filter-btn" data-cat="Events">Events</button>
        <input class="search-box" id="searchBox" placeholder="Search threads...">
      </div>

      <div class="thread-list" id="threadList"></div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="detailView" class="thread-detail">
      <button class="back-btn" onclick="showList()"><i class="fa-solid fa-arrow-left"></i> Back to threads</button>
      <div class="thread-body" id="threadDetail"></div>
      <div class="replies-section">
        <h3 id="replyCount">Replies</h3>
        <div id="repliesList"></div>
      </div>
      <div class="reply-compose" id="replyCompose">
        <textarea id="replyBody" placeholder="Write a reply..."></textarea>
        <button class="btn-primary" onclick="postReply()">Reply</button>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/current-user-store.js"></script>
  <script src="../../js/user-ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      if (window.CurrentUserStore) await window.CurrentUserStore.refreshCurrentUser();
      if (window.UserUI) window.UserUI.bindAllChips();
    });
  </script>
  <script>
    const API_BASE = '/api';
    const headers = { 'Content-Type': 'application/json' };

    let currentCategory = '';
    let currentThreadId = null;

    // ── Fetch threads ──
    async function loadThreads() {
      const search = document.getElementById('searchBox').value.trim();
      let url = `${API_BASE}/forums?limit=50`;
      if (currentCategory) url += `&category=${encodeURIComponent(currentCategory)}`;
      if (search) url += `&search=${encodeURIComponent(search)}`;

      try {
        const res = await fetch(url, { headers, credentials: 'include' });
        const data = await res.json();
        renderThreads(data.payload || []);
      } catch (e) {
        console.error('Load threads error:', e);
        document.getElementById('threadList').innerHTML = '<div class="empty-state"><i class="fa-solid fa-plug-circle-xmark"></i>Could not load threads. Is the server running?</div>';
      }
    }

    function renderThreads(threads) {
      const list = document.getElementById('threadList');
      if (!threads.length) {
        list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-comments"></i>No threads yet. Start a discussion!</div>';
        return;
      }
      list.innerHTML = threads.map(t => {
        const author = t.author || {};
        const initials = ((author.firstName || '?')[0] + (author.lastName || '?')[0]).toUpperCase();
        const timeAgo = formatTimeAgo(t.createdAt);
        return `
          <div class="thread-card ${t.isPinned ? 'pinned' : ''}" onclick="openThread(${t.id})">
            <div class="thread-top">
              <div class="thread-avatar">${initials}</div>
              <div class="thread-meta">
                <span><b>${author.firstName || ''} ${author.lastName || ''}</b></span>
                <span>${timeAgo}</span>
                <span class="thread-tag">${escapeHtml(t.category || 'General')}</span>
                ${t.sport ? `<span class="thread-tag">${escapeHtml(t.sport)}</span>` : ''}
                ${t.isPinned ? '<span><i class="fa-solid fa-thumbtack"></i> Pinned</span>' : ''}
              </div>
            </div>
            <div class="thread-title">${escapeHtml(t.title)}</div>
            <div class="thread-preview">${escapeHtml(t.body)}</div>
            <div class="thread-stats">
              <span><i class="fa-regular fa-message"></i> ${t.replyCount || 0} replies</span>
              <span><i class="fa-regular fa-eye"></i> ${t.viewCount || 0} views</span>
            </div>
          </div>`;
      }).join('');
    }

    // ── Open thread detail ──
    async function openThread(id) {
      currentThreadId = id;
      try {
        const res = await fetch(`${API_BASE}/forums/${id}`, { headers, credentials: 'include' });
        const data = await res.json();
        const t = data.payload;
        const author = t.author || {};
        const initials = ((author.firstName || '?')[0] + (author.lastName || '?')[0]).toUpperCase();

        document.getElementById('threadDetail').innerHTML = `
          <div class="author-row">
            <div class="thread-avatar">${initials}</div>
            <div>
              <b>${author.firstName || ''} ${author.lastName || ''}</b>
              <div style="font-size:12px;color:var(--muted)">${author.role || ''} · ${formatTimeAgo(t.createdAt)}</div>
            </div>
            ${t.sport ? `<span class="thread-tag" style="margin-left:auto">${escapeHtml(t.sport)}</span>` : ''}
            <span class="thread-tag">${escapeHtml(t.category || 'General')}</span>
          </div>
          <h2>${escapeHtml(t.title)}</h2>
          <div class="body-text">${escapeHtml(t.body)}</div>
        `;

        const replies = t.replies || [];
        document.getElementById('replyCount').textContent = `Replies (${replies.length})`;
        document.getElementById('repliesList').innerHTML = replies.map(r => {
          const ra = r.author || {};
          const ri = ((ra.firstName || '?')[0] + (ra.lastName || '?')[0]).toUpperCase();
          return `
            <div class="reply-card">
              <div class="reply-top">
                <div class="thread-avatar" style="width:28px;height:28px;font-size:11px">${ri}</div>
                <b style="font-size:13px">${ra.firstName || ''} ${ra.lastName || ''}</b>
                <span class="reply-time">${formatTimeAgo(r.createdAt)}</span>
              </div>
              <div class="reply-body">${escapeHtml(r.body)}</div>
            </div>`;
        }).join('') || '<div style="color:var(--muted);font-size:13px;padding:20px 0">No replies yet. Be the first!</div>';

        document.getElementById('listView').style.display = 'none';
        document.getElementById('detailView').classList.add('visible');
      } catch (e) {
        console.error('Open thread error:', e);
      }
    }

    function showList() {
      document.getElementById('detailView').classList.remove('visible');
      document.getElementById('listView').style.display = 'block';
      currentThreadId = null;
    }

    // ── Create thread ──
    async function createThread() {
      const title = document.getElementById('threadTitle').value.trim();
      const body = document.getElementById('threadBody').value.trim();
      const category = document.getElementById('threadCategory').value;
      const sport = document.getElementById('threadSport').value;

      if (!title || !body) return (window.SpopeerToast && window.SpopeerToast.warning('Title and body are required.'), undefined);
      if (!token) return (window.SpopeerToast && window.SpopeerToast.warning('Please log in first.'), undefined);

      try {
        const res = await fetch(`${API_BASE}/forums`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ title, body, category, sport: sport || undefined })
        });
        const data = await res.json();
        if (!res.ok) return (window.SpopeerToast && window.SpopeerToast.error(data.error || 'Failed to create thread.'), undefined);

        hideCompose();
        loadThreads();
      } catch (e) {
        console.error('Create thread error:', e);
      }
    }

    // ── Post reply ──
    async function postReply() {
      const body = document.getElementById('replyBody').value.trim();
      if (!body) return (window.SpopeerToast && window.SpopeerToast.warning('Reply cannot be empty.'), undefined);
      if (!token) return (window.SpopeerToast && window.SpopeerToast.warning('Please log in first.'), undefined);

      try {
        const res = await fetch(`${API_BASE}/forums/${currentThreadId}/replies`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ body })
        });
        const data = await res.json();
        if (!res.ok) return (window.SpopeerToast && window.SpopeerToast.error(data.error || 'Failed to post reply.'), undefined);

        document.getElementById('replyBody').value = '';
        openThread(currentThreadId);
      } catch (e) {
        console.error('Post reply error:', e);
      }
    }

    // ── Compose toggle ──
    function showCompose() {
      document.getElementById('composeForm').style.display = 'block';
    }
    function hideCompose() {
      document.getElementById('composeForm').style.display = 'none';
      document.getElementById('threadTitle').value = '';
      document.getElementById('threadBody').value = '';
    }

    // ── Filter buttons ──
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.cat || '';
        loadThreads();
      });
    });

    document.getElementById('searchBox').addEventListener('input', debounce(loadThreads, 400));

    // ── Helpers ──
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTimeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.floor(hrs / 24);
      if (days < 30) return days + 'd ago';
      return new Date(dateStr).toLocaleDateString();
    }

    function debounce(fn, ms) {
      let t;
      return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
    }

    // ── Init ──
    loadThreads();
  </script>
<script src="/js/navigation.js"></script>
</body>
</html>
