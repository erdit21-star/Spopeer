<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Highlight Reels - Spopeer</title>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--bg:#0a0a0f;--card:#14141c;--border:#23233a;--ink:#e8e8ed;--muted:#8b8b9e;--accent:#6C5CE7;--accent2:#00CFFD;--green:#22c55e;--red:#ef4444;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
    .page-wrap{max-width:1000px;margin:0 auto;padding:20px}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .page-header h1{font-size:24px;font-weight:800}
    .header-actions{display:flex;gap:10px;align-items:center}
    .header-actions a{color:var(--muted);text-decoration:none;font-size:14px}
    .header-actions a:hover{color:var(--ink)}
    .btn-primary{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer}
    .btn-primary:hover{opacity:.9}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius);font-size:13px;cursor:pointer}

    /* Upload form */
    .upload-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:24px;display:none}
    .upload-form.visible{display:block}
    .upload-form input,.upload-form textarea,.upload-form select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--ink);padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:12px;outline:none;font-family:inherit}
    .upload-form input:focus,.upload-form textarea:focus{border-color:var(--accent)}
    .upload-form textarea{min-height:80px;resize:vertical}
    .form-row{display:flex;gap:10px}
    .form-row select,.form-row input{flex:1}

    .drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:12px}
    .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent)}
    .drop-zone i{font-size:32px;color:var(--muted);display:block;margin-bottom:8px}
    .drop-zone p{color:var(--muted);font-size:13px}
    .drop-zone .file-name{color:var(--accent);font-weight:600;margin-top:8px}

    /* Reel grid */
    .reel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
    .reel-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s}
    .reel-card:hover{transform:translateY(-2px);border-color:var(--accent)}
    .reel-thumb{position:relative;width:100%;padding-top:56.25%;background:#000}
    .reel-thumb video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
    .reel-thumb .play-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center}
    .reel-thumb .play-overlay i{color:#fff;font-size:18px;margin-left:3px}
    .reel-duration{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.8);color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600}
    .reel-info{padding:14px}
    .reel-title{font-size:15px;font-weight:700;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .reel-author{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .reel-avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
    .reel-author-name{font-size:12px;color:var(--muted)}
    .reel-stats{display:flex;gap:14px;font-size:12px;color:var(--muted)}
    .reel-stats i{margin-right:3px}
    .reel-tag{background:rgba(108,92,231,.15);color:var(--accent);padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}

    .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty-state i{font-size:36px;display:block;margin-bottom:12px}

    /* Player modal */
    .player-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:1000}
    .player-overlay.visible{display:flex}
    .player-wrap{max-width:800px;width:95%;position:relative}
    .player-wrap video{width:100%;border-radius:var(--radius)}
    .player-close{position:absolute;top:-40px;right:0;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
    .player-info{color:#fff;margin-top:12px}
    .player-info h3{font-size:18px;margin-bottom:4px}
    .player-info p{font-size:13px;color:rgba(255,255,255,.6)}
  </style>
  <link rel="stylesheet" href="/css/fonts.css">

  <link rel="stylesheet" href="../../css/mobile-responsive.css">
  <script src="../../js/mobile-enhancements.js" defer></script>
    <script src="/js/session-activity-tracker.js" defer></script>
    <script src="/js/smooth-navigation.js" defer></script>
</head>
<body>
  <div class="page-wrap">
    <div class="page-header">
      <h1><i class="fa-solid fa-film"></i> Highlight Reels</h1>
      <div class="header-actions">
        <a href="/feed.html"><i class="fa-solid fa-arrow-left"></i> Home</a>
        <button class="btn-primary" onclick="toggleUpload()"><i class="fa-solid fa-plus"></i> Create Reel</button>
      </div>
    </div>

    <!-- Upload form -->
    <div class="upload-form" id="uploadForm">
      <input type="text" id="reelTitle" placeholder="Reel title (e.g. 'Best Goals of 2026')" maxlength="200">
      <textarea id="reelDesc" placeholder="Description (optional)"></textarea>
      <div class="form-row">
        <select id="reelSport">
          <option value="">Sport (optional)</option>
          <option value="Running">Running</option>
          <option value="Football">Football</option>
          <option value="Basketball">Basketball</option>
          <option value="Tennis">Tennis</option>
          <option value="Swimming">Swimming</option>
          <option value="Cycling">Cycling</option>
          <option value="Boxing">Boxing</option>
          <option value="Gym">Gym & Fitness</option>
          <option value="Other">Other</option>
        </select>
        <input type="number" id="reelDuration" placeholder="Duration (seconds)" min="1" max="3600" style="flex:.5">
      </div>
      <div class="drop-zone" id="dropZone">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <p>Drop video here or click to browse</p>
        <p style="font-size:11px;margin-top:4px">MP4, WebM, MOV — Max 50MB</p>
        <div class="file-name" id="fileName" style="display:none"></div>
        <input type="file" id="videoFile" accept="video/*" style="display:none">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn-secondary" onclick="toggleUpload()">Cancel</button>
        <button class="btn-primary" id="uploadBtn" onclick="uploadReel()" disabled>Upload Reel</button>
      </div>
    </div>

    <!-- Reel grid -->
    <div class="reel-grid" id="reelGrid"></div>
  </div>

  <!-- Player modal -->
  <div class="player-overlay" id="playerOverlay">
    <div class="player-wrap">
      <button class="player-close" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
      <video id="playerVideo" controls></video>
      <div class="player-info">
        <h3 id="playerTitle"></h3>
        <p id="playerDesc"></p>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/current-user-store.js"></script>
  <script src="../../js/user-ui.js"></script>
  <script src="/js/inline/pages-community-reels-inline-1.js"></script>
  <script src="/js/inline/pages-community-reels-inline-2.js"></script>
<script src="/js/navigation.js"></script>
</body>
</html>
