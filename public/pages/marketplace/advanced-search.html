<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Search — Spopeer</title>
  <script src="../../js/profile-sync-service.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --bg: #fafaf8;
      --white: #ffffff;
      --ink: #111111;
      --ink-2: #333333;
      --muted: #7a7a7a;
      --muted-2: #b8b8b8;
      --border: #ebebE7;
      --surface: #f3f3ef;
      --surface-2: #eeeeea;
      --accent: #001f3f;
      --accent-lt: #cce7ff;
      --accent-hover: #003366;
      --blue: #1a6bff;
      --green: #16a34a;
      --fD: 'Syne', sans-serif;
      --fB: 'Plus Jakarta Sans', sans-serif;
      --nav-h: 64px;
      --r: 10px;
      --pill: 999px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--fB);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* TOPNAV */
    .topnav {
      position: sticky; top: 0; z-index: 300;
      height: var(--nav-h);
      background: rgba(250,250,248,0.94);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1280px; margin: 0 auto;
      height: 100%; padding: 0 24px;
      display: flex; align-items: center; gap: 16px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo-text {
      font-family: var(--fd, var(--fD, sans-serif));
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -.03em;
    }

    .nav-right {
      margin-left: auto; display: flex; align-items: center; gap: 12px;
    }

    .nav-breadcrumb {
      font-size: 13px; color: var(--muted);
      padding-left: 12px; border-left: 1px solid var(--border);
    }

    /* LAYOUT */
    .search-layout {
      max-width: 1280px; margin: 0 auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      padding: 24px;
    }

    /* FILTERS PANEL */
    .filters-panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 24px;
      height: fit-content;
      position: sticky;
      top: calc(var(--nav-h) + 24px);
    }

    .filters-title {
      font-family: var(--fD);
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filters-reset {
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: 0.2s;
    }

    .filters-reset:hover {
      background: var(--surface);
      color: var(--ink);
    }

    .filter-group {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .filter-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .filter-input,
    .filter-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-family: var(--fB);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .filter-input:focus,
    .filter-select:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--accent-lt);
    }

    .filter-range {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .filter-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-checkbox input {
      cursor: pointer;
    }

    .filter-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-search {
      padding: 10px;
      border: 1.5px solid var(--accent);
      background: var(--accent);
      color: var(--accent-lt);
      border-radius: var(--r);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-search:hover {
      background: var(--accent-hover);
    }

    .btn-clear {
      padding: 10px;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--ink);
      border-radius: var(--r);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-clear:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* RESULTS PANEL */
    .results-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
    }

    .results-count {
      font-size: 13px;
      color: var(--muted);
    }

    .results-sort {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .results-sort select {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--fB);
      cursor: pointer;
      background: var(--white);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .result-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      transition: 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .result-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(0,31,63,0.08);
    }

    .result-image {
      width: 100%;
      height: 160px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: var(--muted-2);
      overflow: hidden;
    }

    .result-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-content {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .result-title {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      overflow: hidden;
    }

    .result-price {
      font-family: var(--fD);
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .result-meta {
      font-size: 11px;
      color: var(--muted);
    }

    .result-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 8px;
      margin-top: 8px;
      border-top: 1px solid var(--border);
    }

    .result-tag {
      font-size: 9px;
      background: var(--surface);
      color: var(--muted);
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* EMPTY STATE */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 40px;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .empty-state-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .empty-state-text {
      font-size: 14px;
      color: var(--muted);
    }

    /* SAVED SEARCHES */
    .saved-searches {
      background: var(--surface);
      border-radius: var(--r);
      padding: 16px;
      margin-top: 20px;
    }

    .saved-searches-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      color: var(--muted);
    }

    .saved-search-item {
      padding: 8px;
      margin-bottom: 6px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }

    .saved-search-item:hover {
      border-color: var(--accent);
      background: var(--accent-lt);
    }

    .saved-search-item button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
    }

    /* RESPONSIVE */
    @media (max-width: 960px) {
      .search-layout {
        grid-template-columns: 1fr;
      }

      .filters-panel {
        position: static;
      }

      .results-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }
    }

    @media (max-width: 640px) {
      .search-layout {
        padding: 16px;
        gap: 16px;
      }

      .results-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .results-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <link rel="stylesheet" href="/css/fonts.css">

  <link rel="stylesheet" href="../../css/mobile-responsive.css">
  <script src="../../js/mobile-enhancements.js" defer></script>
</head>
<body>
  <script>
    var _ud = JSON.parse(localStorage.getItem('spopeer_user') || 'null');
    var _li = localStorage.getItem('spopeer_loggedIn') === 'true';
    if (!_ud || !_li) window.location.href = '/pages/auth/login.html';
  </script>

  <!-- TOPNAV -->
  <nav class="topnav">
    <div class="nav-inner">
      <a href="/index.html" class="logo" data-home-link><span class="logo-mark"><img src="/assets/images/logo-s.jpg" alt="Spopeer"></span><span class="logo-text">Spopeer</span></a>
      <div class="nav-right">
        <a href="./marketplace.html" class="nav-breadcrumb">Back to Marketplace</a>
      </div>
    </div>
  </nav>

  <!-- MAIN LAYOUT -->
  <div class="search-layout">
    <!-- FILTERS PANEL -->
    <aside class="filters-panel">
      <div class="filters-title">
        Filters
        <span class="filters-reset" onclick="resetFilters()">Reset</span>
      </div>

      <!-- Search -->
      <div class="filter-group">
        <label class="filter-label">Search</label>
        <input type="text" id="searchTerm" class="filter-input" placeholder="Keywords...">
      </div>

      <!-- Price Range -->
      <div class="filter-group">
        <label class="filter-label">Price Range (€)</label>
        <div class="filter-range">
          <input type="number" id="minPrice" class="filter-input" placeholder="Min" min="0">
          <input type="number" id="maxPrice" class="filter-input" placeholder="Max" min="0">
        </div>
      </div>

      <!-- Category -->
      <div class="filter-group">
        <label class="filter-label">Category</label>
        <select id="category" class="filter-select">
          <option value="">All Categories</option>
          <option value="Sports Equipment">Sports Equipment</option>
          <option value="Sportswear & Apparel">Sportswear & Apparel</option>
          <option value="Training Services">Training Services</option>
          <option value="Recovery & Wellness">Recovery & Wellness</option>
          <option value="Coaching Packages">Coaching Packages</option>
          <option value="Club Memberships">Club Memberships</option>
        </select>
      </div>

      <!-- Listing Type -->
      <div class="filter-group">
        <label class="filter-label">Listing Type</label>
        <label class="filter-checkbox">
          <input type="checkbox" name="type" value="equipment"> Equipment
        </label>
        <label class="filter-checkbox">
          <input type="checkbox" name="type" value="product"> Products
        </label>
        <label class="filter-checkbox">
          <input type="checkbox" name="type" value="service"> Services
        </label>
      </div>

      <!-- Condition -->
      <div class="filter-group">
        <label class="filter-label">Condition</label>
        <label class="filter-checkbox">
          <input type="checkbox" name="condition" value="new"> New
        </label>
        <label class="filter-checkbox">
          <input type="checkbox" name="condition" value="like-new"> Like New
        </label>
        <label class="filter-checkbox">
          <input type="checkbox" name="condition" value="good"> Good
        </label>
        <label class="filter-checkbox">
          <input type="checkbox" name="condition" value="fair"> Fair
        </label>
      </div>

      <!-- Seller Type -->
      <div class="filter-group">
        <label class="filter-label">Seller Type</label>
        <label class="filter-checkbox">
          <input type="checkbox" name="sellerType" value="athlete"> Athletes
        </label>
        <label class="filter-checkbox">
          <input type="checkbox" name="sellerType" value="coach"> Coaches
        </label>
        <label class="filter-checkbox">
          <input type="checkbox" name="sellerType" value="club"> Clubs
        </label>
        <label class="filter-checkbox">
          <input type="checkbox" name="sellerType" value="supportive_professional"> Professionals
        </label>
      </div>

      <!-- Sorting -->
      <div class="filter-group">
        <label class="filter-label">Sort By</label>
        <select id="sortBy" class="filter-select">
          <option value="newest">Newest</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="popular">Most Popular</option>
          <option value="rating">Highest Rated</option>
          <option value="views">Most Viewed</option>
        </select>
      </div>

      <!-- Action Buttons -->
      <div class="filter-buttons">
        <button class="btn-search" onclick="performSearch()">Search</button>
        <button class="btn-clear" onclick="resetFilters()">Clear</button>
      </div>

      <!-- Saved Searches -->
      <div class="saved-searches">
        <div class="saved-searches-title">Saved Searches</div>
        <div id="savedSearchesList"></div>
        <div style="padding: 8px; font-size: 11px; color: var(--muted); margin-top: 8px;">
          <button style="background: none; border: none; color: var(--accent); cursor: pointer; font-size: 11px; font-weight: 600;" onclick="saveCurrentSearch()">
            + Save current search
          </button>
        </div>
      </div>
    </aside>

    <!-- RESULTS PANEL -->
    <div class="results-panel">
      <!-- Results Header -->
      <div class="results-header">
        <div class="results-count" id="resultsCount">Showing results...</div>
        <div class="results-sort">
          <label for="sortSelect" style="margin: 0;">Sort:</label>
          <select id="sortSelect" onchange="performSearch()">
            <option value="newest">Newest</option>
            <option value="price_asc">Price ↑</option>
            <option value="price_desc">Price ↓</option>
            <option value="popular">Popular</option>
          </select>
        </div>
      </div>

      <!-- Results Grid -->
      <div class="results-grid" id="resultsGrid">
        <div class="loading">
          <div class="loading-spinner"></div>
          <div style="margin-top: 16px;">Loading results...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/marketplace-service.js"></script>
  <script>
    ProfileSyncService.init();

    let allSearchResults = [];

    // Load saved searches on page load
    function loadSavedSearchesUI() {
      const container = document.getElementById('savedSearchesList');
      const saved = MarketplaceService.getSavedSearches();
      const entries = Object.entries(saved);

      if (entries.length === 0) {
        container.innerHTML = '<div style="padding: 8px; font-size: 11px; color: var(--muted);">No saved searches yet</div>';
        return;
      }

      container.innerHTML = entries.map(([name, data]) => `
        <div class="saved-search-item" onclick="loadSavedSearch('${name}')">
          <span>${name}</span>
          <button onclick="event.stopPropagation(); deleteSavedSearch('${name}')">×</button>
        </div>
      `).join('');
    }

    async function performSearch() {
      const filters = {
        search: document.getElementById('searchTerm').value.trim(),
        min_price: document.getElementById('minPrice').value,
        max_price: document.getElementById('maxPrice').value,
        category: document.getElementById('category').value,
        sort: document.getElementById('sortSelect').value || document.getElementById('sortBy').value,
        listing_type: Array.from(document.querySelectorAll('input[name="type"]:checked')).map(el => el.value).join(','),
        condition: Array.from(document.querySelectorAll('input[name="condition"]:checked')).map(el => el.value).join(','),
        seller_type: Array.from(document.querySelectorAll('input[name="sellerType"]:checked')).map(el => el.value).join(',')
      };

      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = '<div class="loading" style="grid-column: 1/-1;"><div class="loading-spinner"></div></div>';

      try {
        const response = await fetch(`/api/marketplace/listings?${new URLSearchParams(filters)}`);
        const data = await response.json();
        allSearchResults = data.listings || [];

        renderResults();
      } catch (error) {
        console.error('Search error:', error);
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"><i class="fa-solid fa-exclamation-triangle"></i></div>
            <div class="empty-state-title">Search Error</div>
            <div class="empty-state-text">Please try again</div>
          </div>
        `;
      }
    }

    function renderResults() {
      const grid = document.getElementById('resultsGrid');
      const count = document.getElementById('resultsCount');

      if (allSearchResults.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"><i class="fa-solid fa-search"></i></div>
            <div class="empty-state-title">No Results Found</div>
            <div class="empty-state-text">Try adjusting your filters or search terms</div>
          </div>
        `;
        count.textContent = 'No results';
        return;
      }

      count.textContent = `${allSearchResults.length} result${allSearchResults.length !== 1 ? 's' : ''} found`;

      grid.innerHTML = allSearchResults.map(listing => `
        <div class="result-card" onclick="window.location.href='./listing-detail.html?id=${listing.id}'">
          <div class="result-image">
            ${listing.images && listing.images.length > 0 
              ? `<img src="${listing.images[0]}" alt="${listing.title}">` 
              : '<i class="fa-solid fa-image"></i>'}
          </div>
          <div class="result-content">
            <div class="result-title">${listing.title}</div>
            <div class="result-price">€${listing.price.toFixed(2)}</div>
            <div class="result-meta">${listing.category} • ${listing.price_type}</div>
            ${listing.sport_tags && listing.sport_tags.length > 0 
              ? `<div class="result-tags">
                  ${listing.sport_tags.slice(0, 3).map(tag => `<span class="result-tag">${tag}</span>`).join('')}
                </div>`
              : ''}
          </div>
        </div>
      `).join('');
    }

    function resetFilters() {
      document.getElementById('searchTerm').value = '';
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      document.getElementById('category').value = '';
      document.getElementById('sortBy').value = 'newest';
      document.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
      document.getElementById('resultsGrid').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon"><i class="fa-solid fa-filter"></i></div>
          <div class="empty-state-title">Advanced Search</div>
          <div class="empty-state-text">Use the filters to find the perfect item</div>
        </div>
      `;
      document.getElementById('resultsCount').textContent = 'Use filters to search';
    }

    function loadSavedSearch(searchName) {
      const saved = MarketplaceService.getSavedSearches();
      if (saved[searchName]) {
        const filters = saved[searchName].filters;
        document.getElementById('searchTerm').value = filters.search || '';
        document.getElementById('minPrice').value = filters.min_price || '';
        document.getElementById('maxPrice').value = filters.max_price || '';
        document.getElementById('category').value = filters.category || '';
        document.getElementById('sortBy').value = filters.sort || 'newest';
        performSearch();
      }
    }

    function saveCurrentSearch() {
      const searchName = document.getElementById('searchTerm').value.trim();
      if (searchName) {
        const filters = {
          search: searchName,
          min_price: document.getElementById('minPrice').value,
          max_price: document.getElementById('maxPrice').value,
          category: document.getElementById('category').value,
          sort: document.getElementById('sortBy').value,
          listing_type: Array.from(document.querySelectorAll('input[name="type"]:checked')).map(el => el.value).join(','),
          condition: Array.from(document.querySelectorAll('input[name="condition"]:checked')).map(el => el.value).join(','),
          seller_type: Array.from(document.querySelectorAll('input[name="sellerType"]:checked')).map(el => el.value).join(',')
        };
        MarketplaceService.saveSearch(searchName, filters);
        alert(`✓ Saved search: "${searchName}"`);
        // Reload saved searches list
        location.reload();
      } else {
        alert('Please enter a search term');
      }
    }

    function deleteSavedSearch(searchName) {
      if (confirm(`Delete saved search: "${searchName}"?`)) {
        MarketplaceService.deleteSavedSearch(searchName);
        location.reload();
      }
    }

    // Initialize
    resetFilters();
    loadSavedSearchesUI();
  </script>
<script src="/js/navigation.js"></script>
</body>
</html>
