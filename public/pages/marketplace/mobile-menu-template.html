<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
  <title>Mobile Menu — Spopeer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root {
      --bg: #fafaf8;
      --white: #ffffff;
      --ink: #111111;
      --muted: #7a7a7a;
      --border: #ebebE7;
      --accent: #001f3f;
      --accent-lt: #cce7ff;
      --fD: 'Syne', sans-serif;
      --fB: 'Plus Jakarta Sans', sans-serif;
      --r: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--fB);
      background: var(--bg);
      color: var(--ink);
    }

    /* MOBILE MENU OVERLAY */
    .mobile-menu {
      position: fixed;
      left: -100%;
      top: 0;
      width: 80%;
      max-width: 320px;
      height: 100vh;
      background: var(--white);
      transition: left 0.3s ease;
      z-index: 999;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }

    .mobile-menu.open {
      left: 0;
    }

    .mobile-menu-backdrop {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 998;
    }

    .mobile-menu.open ~ .mobile-menu-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-menu-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mobile-menu-close {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      color: var(--ink);
    }

    .mobile-menu-section {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .mobile-menu-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .mobile-menu-item {
      padding: 16px;
      border-radius: var(--r);
      margin-bottom: 8px;
      background: transparent;
      border: none;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
      width: 100%;
    }

    .mobile-menu-item:hover {
      background: var(--bg);
      color: var(--accent);
    }

    .mobile-menu-item.active {
      background: var(--accent);
      color: var(--accent-lt);
    }

    .mobile-menu-item i {
      font-size: 16px;
    }

    /* MOBILE OPTIMIZATIONS FOR EXISTING PAGES */
    @media (max-width: 640px) {
      /* Buttons should be at least 44px tall for touch */
      button, a.btn-apply, a.btn-create, a.btn-search, 
      input[type="button"], input[type="submit"] {
        min-height: 44px;
        min-width: 44px;
        padding: 12px 16px;
      }

      /* Touch targets spacing */
      input[type="checkbox"],
      input[type="radio"] {
        width: 20px;
        height: 20px;
        min-width: 44px;
        min-height: 44px;
        cursor: pointer;
      }

      /* Modal improvements for mobile */
      .modal {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        top: auto;
        height: auto;
        max-height: 90vh;
        border-radius: 20px 20px 0 0;
        width: 100%;
        padding: 20px;
      }

      /* Filter sidebar as drawer */
      .filter-sidebar {
        position: fixed;
        left: -100%;
        top: 64px;
        width: 100%;
        height: auto;
        max-height: 90vh;
        transition: left 0.3s ease;
        z-index: 100;
        border-radius: 0;
        border-bottom: 1px solid var(--border);
      }

      .filter-sidebar.open {
        left: 0;
      }

      /* Sticky header improvements */
      .topnav {
        z-index: 300;
      }
    }

    /* Portrait orientation optimizations */
    @media (max-width: 480px) {
      .mobile-menu {
        width: 100%;
        max-width: 100%;
      }

      .modal {
        padding: 16px;
        border-radius: 16px 16px 0 0;
      }
    }

    /* Landscape mode adjustments */
    @media (max-height: 500px) {
      .mobile-menu {
        height: 85vh;
        overflow-y: scroll;
      }
    }
  </style>
  <link rel="stylesheet" href="/css/fonts.css">

  <link rel="stylesheet" href="../../css/mobile-responsive.css">
  <script src="../../js/mobile-enhancements.js" defer></script>
</head>
<body>
  <!-- This is a utility file for mobile menu structure -->
  <!-- Include this in marketplace pages as a template -->

  <!-- MOBILE MENU EXAMPLE -->
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-header">
      <span style="font-weight: 600;">Menu</span>
      <button class="mobile-menu-close" onclick="closeMobileMenu()">
        <i class="fa-solid fa-times"></i>
      </button>
    </div>

    <div class="mobile-menu-section">
      <div class="mobile-menu-section-title">Main</div>
      <button class="mobile-menu-item" onclick="navigateTo('./marketplace.html')">
        <i class="fa-solid fa-store"></i> Marketplace
      </button>
      <button class="mobile-menu-item" onclick="navigateTo('./my-listings.html')">
        <i class="fa-solid fa-list"></i> My Listings
      </button>
      <button class="mobile-menu-item" onclick="navigateTo('./messages.html')">
        <i class="fa-solid fa-envelope"></i> Messages
      </button>
      <button class="mobile-menu-item" onclick="navigateTo('./notifications.html')">
        <i class="fa-solid fa-bell"></i> Notifications
      </button>
    </div>

    <div class="mobile-menu-section">
      <div class="mobile-menu-section-title">Tools</div>
      <button class="mobile-menu-item" onclick="navigateTo('./advanced-search.html')">
        <i class="fa-solid fa-search"></i> Advanced Search
      </button>
      <button class="mobile-menu-item" onclick="navigateTo('./analytics.html')">
        <i class="fa-solid fa-chart-line"></i> Analytics
      </button>
      <button class="mobile-menu-item" onclick="navigateTo('./create-listing.html')">
        <i class="fa-solid fa-plus"></i> Create Listing
      </button>
    </div>

    <div class="mobile-menu-section">
      <div class="mobile-menu-section-title">Account</div>
        <button class="mobile-menu-item" onclick="navigateTo('../profiles/public-profile.html')">
        <i class="fa-solid fa-user"></i> Profile
      </button>
      <button class="mobile-menu-item" onclick="logout()">
        <i class="fa-solid fa-sign-out"></i> Logout
      </button>
    </div>
  </div>

  <div class="mobile-menu-backdrop" onclick="closeMobileMenu()"></div>

  <script>
    function toggleMobileMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('open');
    }

    function closeMobileMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.remove('open');
    }

    function navigateTo(url) {
      closeMobileMenu();
      window.location.href = url;
    }

    function logout() {
      ['spopeer_token','spopeer_user','spopeer_loggedIn','authToken','token','user','userToken','userData'].forEach(function(key){ localStorage.removeItem(key); });
      window.location.href = '/index.html';
    }

    // Close menu when clicking backdrop
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('mobileMenu');
      if (menu && !menu.contains(e.target) && !e.target.closest('[onclick*="toggleMobileMenu"]')) {
        closeMobileMenu();
      }
    });
  </script>
<script src="/js/navigation.js"></script>
</body>
</html>
