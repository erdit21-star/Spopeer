  <style>
    /* Marketplace-specific nav additions */
    .nav-breadcrumb {
      font-size: 13px; color: var(--muted);
      padding-left: 12px; border-left: 1px solid var(--border);
    }

    .nav-icon-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      color: var(--ink);
      transition: 0.2s;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .nav-icon-btn:hover {
      background: var(--surface);
      color: var(--accent);
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ef4444;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
    }

    /* LAYOUT */
    .app-layout {
      max-width: 1280px; margin: 0 auto;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      padding: 24px;
    }

    /* SIDEBAR FILTERS */
    .filter-sidebar {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px;
      height: fit-content;
      position: sticky;
      top: calc(var(--nav-h) + 24px);
    }

    .filter-section {
      margin-bottom: 20px;
    }

    .filter-section:not(:last-child) {
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .filter-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      font-size: 13px;
      color: var(--ink-2);
      cursor: pointer;
    }

    .filter-option input[type="checkbox"],
    .filter-option input[type="radio"] {
      cursor: pointer;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-apply, .btn-reset {
      flex: 1;
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      font-size: 12px;
      font-weight: 600;
      font-family: var(--fB);
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-apply {
      background: var(--accent);
      color: var(--accent-lt);
      border-color: var(--accent);
    }

    .btn-apply:hover {
      background: var(--accent-hover);
    }

    .btn-reset {
      background: transparent;
      color: var(--muted);
    }

    .btn-reset:hover {
      border-color: var(--ink-2);
      color: var(--ink-2);
    }

    /* MAIN CONTENT */
    .marketplace-main {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .marketplace-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .marketplace-header h1 {
      font-family: var(--fD);
      font-size: 24px;
      font-weight: 800;
    }

    .sort-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .sort-control select {
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      background: var(--white);
      font-family: var(--fB);
      cursor: pointer;
      transition: 0.2s;
    }

    .sort-control select:hover {
      border-color: var(--accent);
    }

    /* LISTING GRID */
    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .listing-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      transition: 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .listing-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(0,31,63,0.08);
    }

    .listing-image {
      width: 100%;
      height: 160px;
      background: var(--surface);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: var(--muted-2);
    }

    .listing-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .listing-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--accent);
      color: var(--accent-lt);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      text-transform: capitalize;
    }

    .listing-condition {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .listing-save-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      background: var(--white);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .listing-save-btn:hover {
      background: var(--accent);
      color: var(--white);
    }

    .listing-save-btn.saved {
      background: var(--accent);
      color: var(--white);
    }

    .listing-content {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .listing-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .listing-price {
      font-family: var(--fD);
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .listing-price-type {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .listing-tags {
      display: flex;
      gap: 4px;
      margin: 8px 0;
      flex-wrap: wrap;
    }

    .listing-tag {
      font-size: 10px;
      background: var(--surface);
      color: var(--muted);
      padding: 3px 8px;
      border-radius: 12px;
    }

    .listing-seller {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }

    .listing-seller-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .listing-seller-info {
      flex: 1;
      min-width: 0;
    }

    .listing-seller-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .listing-seller-type {
      font-size: 9px;
      color: var(--muted);
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
    }

    .empty-state-icon {
      font-size: 64px;
      color: var(--muted-2);
      margin-bottom: 16px;
    }

    .empty-state-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .empty-state-text {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .empty-state-btn {
      display: inline-block;
      padding: 10px 24px;
      background: var(--accent);
      color: var(--accent-lt);
      border: none;
      border-radius: var(--r);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
    }

    .empty-state-btn:hover {
      background: var(--accent-hover);
    }

    /* PAGINATION */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
    }

    .pagination button {
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--ink);
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    .pagination button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pagination button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-lt);
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* RESPONSIVE */
    @media (max-width: 960px) {
      .app-layout {
        grid-template-columns: 1fr;
      }

      .filter-sidebar {
        position: static;
      }

      .listings-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }
    }

    @media (max-width: 768px) {
      .app-layout { grid-template-columns: 1fr; }
      .filter-sidebar { display: none; }
      .listings-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .marketplace-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .listings-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      }

      .listing-image {
        height: 120px;
      }
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  .logo {
  display: inline-flex;
  align-items: center;

}
</style>

    .modal {
