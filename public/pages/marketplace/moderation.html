  <style>
    :root {
      --bg: #fafaf8;
      --white: #ffffff;
      --ink: #111111;
      --ink-2: #333333;
      --muted: #7a7a7a;
      --muted-2: #b8b8b8;
      --border: #ebebE7;
      --surface: #f3f3ef;
      --surface-2: #eeeeea;
      --accent: #001f3f;
      --accent-lt: #cce7ff;
      --accent-hover: #003366;
      --blue: #1a6bff;
      --green: #16a34a;
      --red: #ef4444;
      --orange: #f97316;
      --fD: 'Syne', sans-serif;
      --fB: 'Plus Jakarta Sans', sans-serif;
      --nav-h: 64px;
      --r: 10px;
      --pill: 999px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--fB);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* TOPNAV */
    .topnav {
      position: sticky; top: 0; z-index: 300;
      height: var(--nav-h);
      background: rgba(250,250,248,0.94);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1280px; margin: 0 auto;
      height: 100%; padding: 0 24px;
      display: flex; align-items: center; gap: 16px;
    }

    .logo {
      font-family: var(--fD); font-size: 21px; font-weight: 800;
      letter-spacing: -0.02em; color: var(--ink);
      text-decoration: none; display: flex; align-items: center; gap: 7px;
      flex-shrink: 0;
    }

    .logo-dot { width: 8px; height: 8px; background: var(--red); border-radius: 50%; }

    .logo-admin {
      font-size: 11px; font-weight: 700; color: var(--red);
      text-transform: uppercase; letter-spacing: 0.05em;
    }

    .nav-right {
      margin-left: auto; display: flex; align-items: center; gap: 12px;
    }

    .nav-breadcrumb {
      font-size: 13px; color: var(--muted);
      padding-left: 12px; border-left: 1px solid var(--border);
    }

    /* PAGE HEADER */
    .page-header {
      max-width: 1280px; margin: 0 auto;
      padding: 32px 24px;
      border-bottom: 1px solid var(--border);
    }

    .page-header h1 {
      font-family: var(--fD);
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--muted);
    }

    /* STATS ROW */
    .stats-row {
      max-width: 1280px; margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 20px;
      text-align: center;
    }

    .stat-number {
      font-family: var(--fD);
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* CONTROLS */
    .moderation-controls {
      max-width: 1280px; margin: 0 auto;
      padding: 0 24px 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--ink);
      border-radius: var(--pill);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .filter-btn.active {
      background: var(--red);
      color: var(--white);
      border-color: var(--red);
    }

    .filter-btn:hover {
      border-color: var(--red);
    }

    /* CONTENT TABLE */
    .moderation-container {
      max-width: 1280px; margin: 0 auto;
      padding: 0 24px 32px;
    }

    .moderation-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }

    .moderation-table thead {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .moderation-table th {
      padding: 16px 20px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .moderation-table td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .moderation-table tr:last-child td {
      border-bottom: none;
    }

    .item-preview {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .item-image {
      width: 48px;
      height: 48px;
      background: var(--surface);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .flag-reason {
      font-size: 12px;
      background: rgba(239, 68, 68, 0.1);
      color: var(--red);
      padding: 4px 12px;
      border-radius: 12px;
      display: inline-block;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--ink);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-action:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-approve {
      border-color: var(--green);
      color: var(--green);
    }

    .btn-approve:hover {
      background: rgba(22, 163, 74, 0.1);
    }

    .btn-reject {
      border-color: var(--red);
      color: var(--red);
    }

    .btn-reject:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-flagged {
      background: rgba(239, 68, 68, 0.1);
      color: var(--red);
    }

    .status-reviewed {
      background: rgba(22, 163, 74, 0.1);
      color: var(--green);
    }

    .status-pending {
      background: rgba(249, 115, 22, 0.1);
      color: var(--orange);
    }

    /* DETAIL MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--white);
      border-radius: var(--r);
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      width: 90%;
    }

    .modal-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-family: var(--fD);
      font-size: 20px;
      font-weight: 800;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--muted);
    }

    .modal-body {
      padding: 24px;
    }

    .detail-section {
      margin-bottom: 24px;
    }

    .detail-section h3 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .detail-row {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .detail-label {
      font-weight: 600;
      color: var(--ink);
      min-width: 100px;
    }

    .detail-value {
      color: var(--muted);
      flex: 1;
    }

    .modal-actions {
      padding: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .btn-primary, .btn-secondary {
      flex: 1;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: var(--green);
      color: var(--white);
      border-color: var(--green);
    }

    .btn-primary:hover {
      filter: brightness(0.9);
    }

    .btn-secondary {
      background: var(--red);
      color: var(--white);
      border-color: var(--red);
    }

    .btn-secondary:hover {
      filter: brightness(0.9);
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 80px 40px;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.6;
    }

    .empty-state-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .empty-state-text {
      font-size: 14px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .moderation-table {
        display: block;
        border: none;
      }

      .moderation-table thead {
        display: none;
      }

      .moderation-table tr {
        display: block;
        border: 1px solid var(--border);
        border-radius: var(--r);
        margin-bottom: 16px;
      }

      .moderation-table td {
        display: block;
        padding: 12px;
        border: none;
        text-align: right;
        padding-left: 50%;
        position: relative;
      }

      .moderation-table td::before {
        content: attr(data-label);
        position: absolute;
        left: 12px;
        font-weight: 600;
        text-align: left;
      }
    }

  display: inline-flex;

}

<script src="../../js/marketplace-service.js"></script>
  <script>
    ProfileSyncService.init();

    let allFlags = [];
    let currentFilter = 'all';
    let selectedFlagId = null;

    // Build moderation list from listings with real report metadata.
    async function generateFlaggedListings() {
      try {
        const response = await fetch('/api/marketplace/listings?limit=100');
        const data = await response.json();
        const listings = data.listings || [];

        const flags = listings
          .filter((listing) => Number(listing.flagCount || listing.reportCount || 0) > 0 || !!listing.moderationStatus)
          .slice(0, 50)
          .map((listing) => ({
          id: listing.id,
          listingId: listing.id,
          title: listing.title,
          image: listing.images?.[0] || '',
          seller: listing.seller,
          price: listing.price,
          currency: listing.currency,
          reason: listing.flagReason || listing.reportReason || 'User report',
          reportedBy: listing.reportedBy || 'Marketplace user',
          reportedAt: listing.flaggedAt || listing.updatedAt || listing.createdAt || new Date().toISOString(),
          status: (listing.moderationStatus || (Number(listing.flagCount || listing.reportCount || 0) > 0 ? 'pending' : 'reviewed')).toLowerCase(),
          flagCount: Number(listing.flagCount || listing.reportCount || 0) || 1,
          category: 'suspected-violation'
        }));

        return flags;
      } catch (error) {
        console.error('Error loading flagged listings:', error);
        return [];
      }
    }

    async function loadFlaggedListings() {
      try {
        allFlags = await generateFlaggedListings();
        updateStats();
        renderTable();
      } catch (error) {
        console.error('Error loading flagged listings:', error);
      }
    }

    function updateStats() {
      document.getElementById('totalFlagged').textContent = allFlags.length;
      document.getElementById('pendingReview').textContent = allFlags.filter(f => f.status === 'pending').length;
      document.getElementById('suspendedSellers').textContent = allFlags.filter(f => f.status === 'removed').length;
    }

    function renderTable() {
      const tbody = document.getElementById('flaggedListingsTable');
      const filtered = currentFilter === 'all' 
        ? allFlags 
        : allFlags.filter(f => {
            if (currentFilter === 'pending') return f.status === 'pending';
            if (currentFilter === 'reviewed') return f.status !== 'pending';
            if (currentFilter === 'suspicious-seller') return Number(f.flagCount || 0) >= 3;
            return true;
          });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="empty-state" style="padding: 40px 20px;">
                <div class="empty-state-icon"><i class="fa-solid fa-check-circle"></i></div>
                <div class="empty-state-title">No flagged listings</div>
                <div class="empty-state-text">All marketplace content is in good standing</div>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(flag => `
        <tr>
          <td>
            <div class="item-preview">
              <div class="item-image">
                ${flag.image ? `<img src="${flag.image}" alt="${flag.title}">` : '<i class="fa-solid fa-image"></i>'}
              </div>
              <div class="item-info">
                <div class="item-title">${flag.title}</div>
                <div class="item-meta">€${flag.price} • ${flag.flagCount} reports</div>
              </div>
            </div>
          </td>
          <td>${flag.seller.displayName || [flag.seller.firstName, flag.seller.lastName].filter(Boolean).join(' ') || 'Unknown'}</td>
          <td><span class="flag-reason">${flag.reason}</span></td>
          <td><span class="status-badge status-${flag.status === 'pending' ? 'pending' : flag.status === 'reviewed' ? 'reviewed' : 'flagged'}">${flag.status}</span></td>
          <td>
            <div class="action-buttons">
              <button class="btn-action btn-approve" onclick="openModal(${flag.id})">Review</button>
              <button class="btn-action btn-reject" onclick="removeListing(${flag.id})">Remove</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterListings(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTable();
    }

    function openModal(flagId) {
      selectedFlagId = flagId;
      const flag = allFlags.find(f => f.id === flagId);
      if (!flag) return;

      const reportedDate = new Date(flag.reportedAt).toLocaleDateString('en-US', { 
        year: 'numeric', month: 'short', day: 'numeric' 
      });

      document.getElementById('modalBody').innerHTML = `
        <div class="detail-section">
          <h3>Listing Information</h3>
          <div class="detail-row">
            <div class="detail-label">Title</div>
            <div class="detail-value">${flag.title}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Price</div>
            <div class="detail-value">€${flag.price} ${flag.currency}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Seller</div>
            <div class="detail-value">${flag.seller.displayName || [flag.seller.firstName, flag.seller.lastName].filter(Boolean).join(' ') || 'Unknown'} (${flag.seller.role || flag.seller.userType || 'user'})</div>
          </div>
        </div>

        <div class="detail-section">
          <h3>Flag Details</h3>
          <div class="detail-row">
            <div class="detail-label">Reason</div>
            <div class="detail-value">${flag.reason}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Report Count</div>
            <div class="detail-value">${flag.flagCount} reports</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Reported Date</div>
            <div class="detail-value">${reportedDate}</div>
          </div>
          <div class="detail-row">
            <div class="detail-label">Reported By</div>
            <div class="detail-value">${flag.reportedBy}</div>
          </div>
        </div>

        <div class="detail-section">
          <h3>Status</h3>
          <div class="detail-row">
            <div class="detail-label">Current Status</div>
            <div class="detail-value"><span class="status-badge status-${flag.status}">${flag.status}</span></div>
          </div>
        </div>
      `;

      document.getElementById('detailModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('show');
      selectedFlagId = null;
    }

    function approveAndClose() {
      if (!selectedFlagId) return;
      const flag = allFlags.find(f => f.id === selectedFlagId);
      if (flag) {
        flag.status = 'approved';
        renderTable();
        closeModal();
        if (window.SpopeerToast) window.SpopeerToast.success('Listing approved. Flag resolved.');
      }
    }

    function rejectAndClose() {
      if (!selectedFlagId) return;
      const flag = allFlags.find(f => f.id === selectedFlagId);
      if (flag) {
        flag.status = 'removed';
        renderTable();
        closeModal();
        if (window.SpopeerToast) window.SpopeerToast.success('Listing removed from marketplace. Seller notified.');
      }
    }

    function removeListing(flagId) {
      if (confirm('Are you sure you want to remove this listing?')) {
        const flag = allFlags.find(f => f.id === flagId);
        if (flag) {
          flag.status = 'removed';
          renderTable();
          if (window.SpopeerToast) window.SpopeerToast.success('Listing removed from marketplace.');
        }
      }
    }

    loadFlaggedListings();
  </script>

</script>
