<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spopeer · Library</title>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script>
    window.Auth.requireAuth();
  </script>
  <script src="../../js/library-page.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/shared-tokens.css" />
  <link rel="stylesheet" href="/css/shared-nav.css" />
  <style>
    .app-layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 24px 36px;
      display: grid;
      grid-template-columns: var(--left-w) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .sidebar-left {
      position: sticky;
      top: calc(var(--nav-h) + 16px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--rM);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-2);
      text-decoration: none;
      transition: .2s;
    }

    .nav-item:visited,
    .nav-item:hover,
    .nav-item:focus,
    .nav-item:active {
      text-decoration: none;
    }

    .nav-item:hover {
      background: var(--surface);
      color: var(--ink);
    }

    .nav-item.active {
      background: var(--accent-lt);
      color: var(--accent);
      font-weight: 700;
    }

    .library-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page-head {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--rL);
      padding: 22px;
    }

    .page-head h1 {
      margin: 0 0 6px;
      font-family: var(--fD);
      font-size: 34px;
      letter-spacing: -.03em;
    }

    .page-head p {
      margin: 0;
      color: var(--muted);
      max-width: 760px;
    }

    .library-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--rL);
      padding: 12px;
    }

    .library-tab {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: .2s;
      font-family: var(--fB);
    }

    .library-tab.active {
      background: var(--accent);
      color: #fff;
    }

    .library-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .library-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--rL);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 190px;
    }

    .library-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .library-type {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: var(--accent-lt);
      color: var(--accent);
      padding: 5px 9px;
      border-radius: var(--pill);
    }

    .library-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.3;
    }

    .library-desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .library-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .meta-chip {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--pill);
      padding: 6px 10px;
    }

    .empty-state {
      background: var(--white);
      border: 1.5px dashed var(--border);
      border-radius: var(--rL);
      padding: 32px;
      text-align: center;
      color: var(--muted);
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: var(--pill);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: .2s;
      font-family: var(--fB);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border: 1.5px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--white);
      border-color: var(--accent);
    }

    .site-footer {
      background: var(--white);
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }
    .footer-grid {
      max-width: 1280px;
      margin: 0 auto;
      padding: 48px 24px 0;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr;
      gap: 40px;
    }
    .foot-logo {
      font-family: var(--fD);
      font-size: 21px;
      font-weight: 800;
      color: var(--ink);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
    }
    .foot-brand p { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 18px; max-width: 230px; }
    .social-row { display: flex; gap: 7px; }
    .soc-btn {
      width: 34px;
      height: 34px;
      border: 1.5px solid var(--border);
      border-radius: var(--rS);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      transition: .2s;
    }
    .soc-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); }
    .foot-col h5 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ink); margin-bottom: 14px; }
    .foot-col ul { list-style: none; }
    .foot-col ul li { margin-bottom: 9px; }
    .foot-col ul a { font-size: 13px; color: var(--muted); text-decoration: none; transition: color .2s; }
    .foot-col ul a:hover { color: var(--accent); }
    .footer-btm {
      max-width: 1280px;
      margin: 36px auto 0;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .footer-btm p { font-size: 12px; color: var(--muted-2); }
    .footer-btm-links { display: flex; gap: 18px; }
    .footer-btm-links a { font-size: 12px; color: var(--muted-2); text-decoration: none; }
    .footer-btm-links a:hover { color: var(--accent); }

    @media (max-width: 960px) {
      .app-layout {
        grid-template-columns: 1fr;
      }

      .sidebar-left {
        position: static;
      }

      .library-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="/css/fonts.css">

  <link rel="stylesheet" href="../../css/mobile-responsive.css">
  <script src="../../js/mobile-enhancements.js" defer></script>
</head>
<body>
  <header class="topnav">
    <div class="nav-inner">
      <a href="/index.html" class="logo" data-home-link>
        <span class="logo-mark">
          <img src="/assets/images/logo-s.jpg" alt="Spopeer">
        </span>
        <span class="logo-text">Spopeer</span>
      </a>
      <div class="nav-right">
        <div class="user-chip" id="userChip" data-user-chip>
          <span class="chip-avatar" data-user-chip-avatar>?</span>
          <span class="chip-name" data-user-chip-name>Loading…</span>
          <i class="fa-solid fa-chevron-down chip-caret"></i>
        </div>
        <div class="profile-menu" id="profileMenu" data-user-menu aria-hidden="true">
          <div class="profile-menu-section" data-section="identity">
            <div class="profile-menu-section-header" role="button" tabindex="0" aria-expanded="true">
              <div class="profile-menu-title">Your Identity</div>
              <i class="fa-solid fa-chevron-down profile-menu-section-toggle" aria-hidden="true"></i>
            </div>
            <div class="profile-menu-section-items">
              <button class="profile-menu-item" data-action="view-profile"><i class="fa-regular fa-id-badge"></i> View Profile</button>
              <button class="profile-menu-item" data-action="edit-profile"><i class="fa-regular fa-pen-to-square"></i> Edit Profile</button>
              <button class="profile-menu-item" data-action="your-activity"><i class="fa-regular fa-chart-line"></i> Your Posts / Activity</button>
            </div>
          </div>
          <div class="profile-menu-section collapsed" data-section="account">
            <div class="profile-menu-section-header" role="button" tabindex="0" aria-expanded="false">
              <div class="profile-menu-title">Account &amp; Settings</div>
              <i class="fa-solid fa-chevron-down profile-menu-section-toggle" aria-hidden="true"></i>
            </div>
            <div class="profile-menu-section-items">
              <button class="profile-menu-item" data-action="account-settings"><i class="fa-regular fa-gear"></i> Account Settings</button>
              <button class="profile-menu-item" data-action="notifications"><i class="fa-regular fa-bell"></i> Notification Preferences</button>
              <button class="profile-menu-item" data-action="privacy"><i class="fa-regular fa-shield"></i> Privacy &amp; Safety</button>
              <button class="profile-menu-item" data-action="my-sports"><i class="fa-solid fa-dumbbell"></i> My Sports</button>
              <button class="profile-menu-item" data-action="download-data"><i class="fa-solid fa-download"></i> Download My Data</button>
              <button class="profile-menu-item" data-action="switch-account"><i class="fa-solid fa-repeat"></i> Switch Account</button>
            </div>
          </div>
          <div class="profile-menu-section collapsed" data-section="features">
            <div class="profile-menu-section-header" role="button" tabindex="0" aria-expanded="false">
              <div class="profile-menu-title">Platform Features</div>
              <i class="fa-solid fa-chevron-down profile-menu-section-toggle" aria-hidden="true"></i>
            </div>
            <div class="profile-menu-section-items">
              <button class="profile-menu-item" data-action="my-analytics"><i class="fa-solid fa-chart-bar"></i> My Analytics</button>
              <button class="profile-menu-item" data-action="ads-manager"><i class="fa-solid fa-bullhorn"></i> Ads Manager</button>
              <button class="profile-menu-item" data-action="achievements"><i class="fa-solid fa-trophy"></i> Achievements &amp; Badges</button>
              <button class="profile-menu-item" data-action="connections"><i class="fa-regular fa-handshake"></i> Your Connections</button>
              <button class="profile-menu-item" data-action="library"><i class="fa-regular fa-bookmark"></i> Saved / Library</button>
              <button class="profile-menu-item" data-action="events"><i class="fa-regular fa-calendar"></i> Your Events</button>
              <button class="profile-menu-item" data-action="invite-friends"><i class="fa-solid fa-user-plus"></i> Invite Friends</button>
            </div>
          </div>
          <div class="profile-menu-section collapsed" data-section="help">
            <div class="profile-menu-section-header" role="button" tabindex="0" aria-expanded="false">
              <div class="profile-menu-title">Help &amp; Misc</div>
              <i class="fa-solid fa-chevron-down profile-menu-section-toggle" aria-hidden="true"></i>
            </div>
            <div class="profile-menu-section-items">
              <button class="profile-menu-item" data-action="help"><i class="fa-regular fa-question-circle"></i> Help Center</button>
              <button class="profile-menu-item" data-action="report"><i class="fa-regular fa-flag"></i> Report a Problem</button>
              <button class="profile-menu-item" data-action="changelog"><i class="fa-regular fa-list"></i> What's New / Changelog</button>
            </div>
          </div>
          <div class="profile-menu-section">
            <div class="profile-menu-section-items" style="padding:10px 16px 10px;">
              <button class="profile-menu-item logout" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="app-layout">
    <aside class="sidebar-left">
      <a href="/feed.html" class="nav-item"><i class="fa-solid fa-house"></i> Feed</a>
      <a href="../library/index.html" class="nav-item active"><i class="fa-solid fa-bookmark"></i> Library</a>
      <a href="../events/event.html" class="nav-item"><i class="fa-regular fa-calendar"></i> Events</a>
      <a href="../sponsorship/sponsor.html" class="nav-item"><i class="fa-solid fa-handshake-angle"></i> Sponsorship</a>
      <a href="../dashboard/settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
    </aside>

    <section class="library-main">
      <div class="page-head">
        <h1>Your Library</h1>
        <p>
          Keep your activity organized in one place: posts, links, articles, videos,
          images, events, and sponsorships.
        </p>
      </div>

      <div class="library-tabs">
        <button class="library-tab active" data-library-tab="all">All</button>
        <button class="library-tab" data-library-tab="posts">Posts</button>
        <button class="library-tab" data-library-tab="links">Links</button>
        <button class="library-tab" data-library-tab="articles">Articles</button>
        <button class="library-tab" data-library-tab="videos">Videos</button>
        <button class="library-tab" data-library-tab="images">Images</button>
        <button class="library-tab" data-library-tab="events">Events</button>
        <button class="library-tab" data-library-tab="sponsorships">Sponsorships</button>
      </div>

      <div class="library-tabs" style="padding:10px 12px;gap:8px;align-items:center;justify-content:space-between;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <label for="librarySourceFilter" style="font-size:12px;color:var(--muted);font-weight:700;">Source</label>
          <select id="librarySourceFilter" style="padding:9px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;background:var(--white);">
            <option value="all">All Sources</option>
            <option value="created">Created by me</option>
            <option value="saved">Saved/liked/commented</option>
          </select>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <label for="librarySort" style="font-size:12px;color:var(--muted);font-weight:700;">Sort</label>
          <select id="librarySort" style="padding:9px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;background:var(--white);">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="title">Title (A-Z)</option>
          </select>
        </div>
      </div>

      <div id="libraryContent"></div>
    </section>
  </main>

  
<script src="/js/shared-ui.js"></script>
<script src="/js/navigation.js"></script>
<script src="/js/current-user-store.js"></script>
<script src="/js/user-ui.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async function () {
    if (window.CurrentUserStore) await window.CurrentUserStore.refreshCurrentUser();
    if (window.UserUI) window.UserUI.bindAllChips();
  });
</script>
</body>
</html>
