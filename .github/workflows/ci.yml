name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Syntax check
        run: node scripts/syntax-check.js
      - name: ESLint (report only while legacy lint debt is addressed)
        run: npx eslint . --max-warnings 0 || true

  server-tests:
    name: Server & utility tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: spopeer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d spopeer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/spopeer_test
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-64-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-64-characters-long
      APP_URL: http://127.0.0.1:5000
      FRONTEND_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Run database migrations
        run: npx sequelize-cli db:migrate --env test
        working-directory: server
      - name: Run Node.js unit tests
        run: node --test tests/*.test.js
