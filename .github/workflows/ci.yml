name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Syntax + lint check ───
  syntax-check:
    name: Syntax & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Install root deps
        run: npm ci
      - name: Syntax check
        run: node scripts/syntax-check.js
      - name: ESLint
        run: npx eslint . --max-warnings 0 || true

  # ─── Server unit / integration tests ───
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: spopeer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/spopeer_test
      JWT_SECRET: ci-test-secret-at-least-64-chars-long-for-testing-purposes-only
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-64-chars-long-for-testing-purposes
      APP_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Run DB migrations
        run: npx sequelize-cli db:migrate --env test
        working-directory: server
      - name: Run server tests
        run: npm test
        working-directory: server

  # ─── Playwright smoke tests ───
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [syntax-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
