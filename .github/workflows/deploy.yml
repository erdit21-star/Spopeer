name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  JWT_SECRET: ci-test-secret-not-for-production
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: spopeer_test
  DB_USER: postgres
  DB_PASSWORD: postgres

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spopeer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Syntax check
        run: node scripts/syntax-check.js

      - name: Lint
        run: npx eslint .

      - name: Run unit/mock tests
        working-directory: ./server
        run: npx jest --config tests/jest.config.cjs --ci

      - name: Run real-DB integration tests
        working-directory: ./server
        run: npx jest --config tests/jest.db.config.cjs --runInBand --ci

      - name: Smoke boot
        working-directory: ./server
        run: |
          timeout 10 node server.js &
          SERVER_PID=$!
          sleep 4
          curl -sf http://localhost:5000/api/health || (kill $SERVER_PID 2>/dev/null; exit 1)
          kill $SERVER_PID 2>/dev/null
          echo "Smoke boot passed"
