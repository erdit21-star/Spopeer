services:
  - type: web
    name: spopeer-web
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    preDeployCommand: npx sequelize-cli db:migrate --env production
    startCommand: node server.js
    plan: starter
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://spopeer.onrender.com
      - key: FRONTEND_URL
        value: https://spopeer.onrender.com
      - key: FRONTEND_URL_ALT
        value: https://spopeer.onrender.com
      - key: DATABASE_DIRECT_URL
        fromDatabase:
          name: spopeer-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: spopeer-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_PREF_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN
        value: "0"
      - key: DB_POOL_ACQUIRE
        value: "10000"
      - key: DB_POOL_IDLE
        value: "5000"
      - key: DB_POOL_EVICT
        value: "15000"
      - key: GOOGLE_VERIFY_TIMEOUT_MS
        value: "10000"
      - key: AUTH_DB_OP_TIMEOUT_MS
        value: "8000"
      - key: GOOGLE_VERIFY_RETRIES
        value: "1"
      - key: AUTH_DB_OP_RETRIES
        value: "1"

databases:
  - name: spopeer-db
    databaseName: spopeer
    user: spopeer
    plan: starter
