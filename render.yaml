services:
  - type: web
    name: spopeer-web
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    preDeployCommand: npx sequelize-cli db:migrate --env production
    startCommand: node server.js
    plan: starter
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URL_ALT
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN
        value: "0"
      - key: DB_POOL_ACQUIRE
        value: "10000"
      - key: DB_POOL_IDLE
        value: "5000"
      - key: DB_POOL_EVICT
        value: "15000"
      - key: GOOGLE_VERIFY_TIMEOUT_MS
        value: "10000"
      - key: AUTH_DB_OP_TIMEOUT_MS
        value: "8000"
      - key: GOOGLE_VERIFY_RETRIES
        value: "1"
      - key: AUTH_DB_OP_RETRIES
        value: "1"
