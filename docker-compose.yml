version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: spopeer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: spopeer
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev-secret-change-me
      FRONTEND_URL: http://localhost:5000
      APP_URL: http://localhost:5000
    depends_on:
      - db
    ports:
      - "5000:5000"

volumes:
  postgres_data:
